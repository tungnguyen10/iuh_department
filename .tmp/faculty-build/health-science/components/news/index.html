<!-- News & Events Section -->
<section data-module="news" class="w-full py-8 md:py-14 {{class}}">
  <div class="container mx-auto px-4 flex flex-col items-center">
    <div data-include="@components/common/section-title.html" 
      data-title="Tin Tức - Sự Kiện"
      data-class=""
      data-title-class="text-title text-center">
    </div>

    <!-- News Carousel -->
    <div class="w-full relative">
      <div class="news-swiper py-4 md:py-6 lg:py-8">
        <div class="swiper-wrapper">
          <!-- Slide 1 -->
          <div class="swiper-slide">
            <div data-include="@components/news/news-card.html"
              data-image="/assets/images/default.jpg"
              data-imageAlt="Tin tức"
              data-title="Thông báo về việc nộp và báo cáo môn học Thiết kế hệ thống thông gió và ĐHKK"
              data-excerpt="Khoa Khoa học Sức khỏe - IUH thông báo đến toàn thể sinh viên. Xem chi tiết và thực hiện đúng hướng dẫn để đảm bảo quyền lợi học tập."
              data-date="12 tháng 5, 2025"
              data-link="news-detail.html"
              data-class="">
            </div>
          </div>

          <!-- Slide 2 -->
          <div class="swiper-slide">
            <div data-include="@components/news/news-card.html"
              data-image="/assets/images/default.jpg"
              data-imageAlt="Tin tức"
              data-title="Lịch đăng ký học kì mới"
              data-excerpt="Khoa Khoa học Sức khỏe - IUH thông báo đến toàn thể sinh viên. Xem chi tiết và thực hiện đúng hướng dẫn để đảm bảo quyền lợi học tập."
              data-date="12 tháng 5, 2025"
              data-link="news-detail.html"
              data-class="">
            </div>
          </div>

          <!-- Slide 3 -->
          <div class="swiper-slide">
            <div data-include="@components/news/news-card.html"
              data-image="/assets/images/default.jpg"
              data-imageAlt="Tin tức"
              data-title="Thông báo về thời hạn nộp khóa luận tốt nghiệp HK1 (2025-2026)"
              data-excerpt="Khoa Khoa học Sức khỏe - IUH thông báo đến toàn thể sinh viên. Xem chi tiết và thực hiện đúng hướng dẫn để đảm bảo quyền lợi học tập."
              data-date="12 tháng 5, 2025"
              data-link="news-detail.html"
              data-class="">
            </div>
          </div>

          <!-- Slide 4 -->
          <div class="swiper-slide">
            <div data-include="@components/news/news-card.html"
              data-image="/assets/images/default.jpg"
              data-imageAlt="Tin tức"
              data-title="Thông báo sinh viên đăng ký dự lễ tốt nghiệp năm 2025"
              data-excerpt="Khoa Khoa học Sức khỏe - IUH thông báo đến toàn thể sinh viên. Xem chi tiết và thực hiện đúng hướng dẫn để đảm bảo quyền lợi học tập."
              data-date="12 tháng 5, 2025"
              data-link="news-detail.html"
              data-class="">
            </div>
          </div>

          <!-- Slide 5 -->
          <div class="swiper-slide">
            <div data-include="@components/news/news-card.html"
              data-image="/assets/images/default.jpg"
              data-imageAlt="Tin tức"
              data-title="Hội thảo chuyên đề: Xu hướng AI trong giáo dục"
              data-excerpt="Khoa Khoa học Sức khỏe - IUH thông báo đến toàn thể sinh viên. Xem chi tiết và thực hiện đúng hướng dẫn để đảm bảo quyền lợi học tập."
              data-date="12 tháng 5, 2025"
              data-link="news-detail.html"
              data-class="">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex items-center gap-4 md:gap-5 lg:gap-[21px]">
      <!-- Previous Button -->
      <button class="news-nav-prev bg-primary-white border border-stroke rounded-full p-2 md:p-2.5 hover:border-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        <img src="/assets/svgs/icon-chevron-left.svg" alt="Previous" class="w-6 h-6 md:w-[30px] md:h-[30px]" />
      </button>

      <!-- Next Button -->
      <button class="news-nav-next bg-primary-white border border-stroke rounded-full p-2 md:p-2.5 hover:border-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        <img src="/assets/svgs/icon-chevron-right.svg" alt="Next" class="w-6 h-6 md:w-[30px] md:h-[30px]" />
      </button>
    </div>
  </div>
</section>
