<!-- Stats Card Component with Number Counting -->
<div class="group w-full relative aspect-[4/4.2] sm:aspect-[280/270] stats-card transition-transform duration-500 hover:-translate-y-2" data-count="{{count}}" data-suffix="{{suffix}}">
  <!-- Background Image with Overlay -->
  <div class="absolute inset-0 rounded-[8px] sm:rounded-[10px] overflow-hidden">
    <div class="bg-primary-dark-blue/90 absolute top-0 left-0 right-0 bottom-0"></div>
    <img src="{{bgImage}}" alt="" class="w-full h-full object-cover pointer-events-none group-hover:scale-105 transition-transform duration-700" />
  </div>

  <!-- Content Overlay -->
  <div class="absolute inset-0 bg-primary-white group-hover:bg-primary-dark-blue/90 rounded-[8px] sm:rounded-[10px] shadow-[1px_1px_10px_0_rgba(21,56,152,0.15)] sm:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] group-hover:shadow-[4px_8px_30px_0_rgba(21,56,152,0.35)] transition-all duration-500 flex flex-col items-center justify-center gap-2 sm:gap-3 md:gap-[15px] px-2 sm:px-4 md:px-5 py-4 sm:py-6 md:py-10">
    
    <!-- Icon -->
    <div class="w-[45px] h-[45px] sm:w-[60px] sm:h-[60px] md:w-[60px] md:h-[60px] shrink-0 stats-icon transition-transform duration-500 group-hover:scale-110 group-hover:-translate-y-1">
      <img src="{{icon}}" alt="{{iconAlt}}" class="w-full h-full object-contain text-primary-dark-blue group-hover:text-primary-white transition-all duration-500" />
    </div>

    <!-- Description -->
    <div class="min-h-[32px] sm:min-h-[40px] md:h-14 flex items-center justify-center w-full px-1">
      <p class="font-roboto font-medium text-lg sm:text-xl lg:text-2xl text-gray group-hover:text-primary-white text-center leading-tight sm:leading-normal transition-colors duration-500 line-clamp-2">
        {{description}}
      </p>
    </div>

    <!-- Number Counter -->
    <div class="flex items-center justify-center transition-transform duration-500 group-hover:scale-105">
      <p class="font-inter font-bold text-[32px] sm:text-[38px] md:text-[42px] lg:text-[50px] text-primary-dark-blue group-hover:text-primary-yellow text-center leading-none transition-all duration-500 stats-number">
        0
      </p>
      <span class="font-inter font-bold text-[32px] sm:text-[38px] md:text-[42px] lg:text-[50px] text-primary-dark-blue group-hover:text-primary-yellow leading-none transition-all duration-500 stats-suffix">
        {{suffix}}
      </span>
    </div>
  </div>
</div>
