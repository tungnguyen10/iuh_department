<!-- Download Button Component -->
<!-- Yellow to Dark Blue with Download Icon -->
<a href="{{url}}" download 
  class="group inline-flex items-center gap-2 px-4 py-2.5 bg-primary-yellow hover:bg-primary-dark-blue rounded-lg transition-all duration-300 hover:shadow-md active:scale-95 {{class}}">
  <img src="/assets/svgs/icon-download.svg" alt="" class="w-5 h-5 text-primary-dark-blue group-hover:text-white transition-colors duration-300" />
  <span class="font-roboto font-medium text-sm text-primary-dark-blue group-hover:text-white transition-colors duration-300">{{text}}</span>
</a>
