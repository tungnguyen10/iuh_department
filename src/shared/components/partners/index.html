<section data-module="partners" class="partners-section w-full py-8 md:py-14 bg-primary-dark-blue relative {{class}}">
    <!-- Background Canvases -->
    <canvas class="partners-canvas absolute inset-0 w-full h-full opacity-60"></canvas>
    <canvas class="partners-logo-canvas absolute -top-3 md:-top-5 left-0 w-full h-6 md:h-10 pointer-events-none" ></canvas>

    <!-- Content Container -->
    <div class="relative z-20 container mx-auto px-4 flex flex-col lg:flex-row items-start md:items-center justify-between gap-8 md:gap-10">
        <!-- Partners Header -->
        <div class="flex flex-col gap-6 md:gap-10 w-full lg:w-auto">
            <!-- Title & Description -->
            <div data-include="@shared/components/common/section-title.html" 
                 data-title="Đối tác tiêu biểu"
                 data-subtitle=""
                 data-description="Công ty công nghệ, doanh nghiệp đối tác lâu năm – cơ hội hợp tác rộng mở."
                 data-class="flex flex-col gap-3 md:gap-[15px]"
                 data-title-class="text-primary-white"
                 data-description-class="text-primary-white max-w-[380px]">
            </div>
            
            <!-- View All Button -->
            <div data-include="@shared/components/button/button.html" 
                 data-variant="6" 
                 data-text="Xem tất cả" 
                 data-url="/partners.html" 
                 data-class="w-fit">
            </div>
        </div>

        <!-- Partners Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 flex-1 w-full lg:max-w-2xl">
            <!-- Partner Logo 1 -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-1.jpg" 
                 data-alt="Partner 1"
                 data-link="/partners.html">
            </div>

            <!-- Partner Logo 2 -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-2.jpg" 
                 data-alt="Partner 2"
                 data-link="/partners.html">
            </div>

            <!-- Partner Logo 3 -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-3.jpg" 
                 data-alt="Partner 3"
                 data-link="/partners.html">
            </div>

            <!-- Partner Logo 4 -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-4.jpg" 
                 data-alt="Partner 4"
                 data-link="/partners.html">
            </div>

            <!-- Partner Logo 5 (Hover State) -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-5.jpg" 
                 data-alt="Partner 5"
                 data-link="/partners.html">
            </div>

            <!-- Partner Logo 6 -->
            <div data-include="@shared/components/partners/partner-logo.html" 
                 data-image="assets/images/partners/partner-6.jpg" 
                 data-alt="Partner 6"
                 data-link="/partners.html">
            </div>
        </div>
    </div>
</section>
