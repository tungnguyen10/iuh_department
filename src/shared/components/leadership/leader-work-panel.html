<section id="leader-work-panel" data-leader-work-panel hidden aria-labelledby="leader-work-panel-title"
    class="relative w-full scroll-mt-24 pt-3" style="--leader-panel-anchor-x: 50%;">
    <span aria-hidden="true"
        class="pointer-events-none absolute top-1 z-20 h-5 w-5 -translate-x-1/2 rotate-45 border-l border-t border-secondary-blue/30 bg-primary-dark-blue transition-[left] duration-200"
        style="left: var(--leader-panel-anchor-x);"></span>

    <div data-leader-work-scroll
        class="max-h-[min(70vh,38rem)] overflow-y-auto rounded-2xl border border-secondary-blue/30 bg-primary-white shadow-[0_18px_45px_rgba(21,56,152,0.16)]">
        <div class="sticky top-0 z-10 flex items-start justify-between gap-4 bg-primary-dark-blue px-5 py-4 md:px-6 md:py-5">
            <div class="min-w-0">
                <p class="font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-yellow">Đang xem phân công</p>
                <h2 id="leader-work-panel-title" data-leader-work-name
                    class="mt-1 font-inter text-xl font-bold text-primary-white md:text-2xl"></h2>
                <p data-leader-work-position class="mt-1 font-roboto text-sm text-primary-white/80 md:text-base"></p>
            </div>
            <button type="button" data-leader-work-close aria-label="Đóng thông tin phụ trách"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border border-primary-white/20 bg-primary-white/10 transition-colors hover:bg-primary-white/20 focus:outline-none focus:ring-2 focus:ring-primary-yellow">
                <img src="/assets/svgs/icon-close.svg" alt="" class="h-5 w-5 brightness-0 invert" />
            </button>
        </div>

        <div class="p-5 md:p-6">
            <div class="rounded-xl border border-secondary-blue/20 bg-secondary-blue-light/55 p-4 md:p-5">
                <p class="font-roboto text-sm md:text-base">
                    <strong class="font-bold text-primary-dark-blue">Mảng công việc phụ trách:</strong>
                </p>
                <ul data-leader-work-content class="mt-3 list-disc space-y-2 pl-5 font-roboto text-sm leading-6 text-gray-700 md:text-base md:leading-7"></ul>
            </div>
        </div>
    </div>
</section>
