<article class="group relative h-full w-full min-w-0 cursor-pointer overflow-hidden rounded-2xl"
    data-leader-work-area="{{workArea}}">
    <!-- Absolute Link Overlay for Full Card Clickability -->
    <a href="{{link}}" class="absolute inset-0 z-50 rounded-2xl focus:outline-none focus:ring-2 focus:ring-primary-yellow focus:ring-inset"
        aria-label="{{name}}" data-leader-work-trigger>
        <span class="sr-only">{{name}}</span>
    </a>
    <!-- Background -->
    <div class="absolute inset-0 z-0 bg-gradient-to-br from-secondary-blue-light via-secondary-blue/20 to-secondary-blue/40 rounded-2xl"></div>
    <div
        class="relative z-10 flex h-full min-w-0 flex-nowrap items-start gap-3 rounded-2xl border border-secondary-blue/30 bg-secondary-blue-light/95 p-4 backdrop-blur-md transition-all duration-500 group-hover:border-primary-yellow group-hover:bg-secondary-blue-light group-hover:shadow-xl group-hover:shadow-secondary-blue/30">
        <!-- Header with Avatar Circle -->
        <div class="relative flex-shrink-0 group-hover:scale-110 transition-transform duration-500">
            <div data-photo-src="{{image}}"
                class="avatar-teacher w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-primary-white ring-4 ring-secondary-blue/40 group-hover:ring-primary-yellow transition-all duration-500 backdrop-blur-sm overflow-hidden">
            </div>
            <div
                class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-primary-yellow flex items-center justify-center shadow-lg shadow-primary-yellow/30 group-hover:shadow-primary-yellow/60 transition-all duration-500">
                <span class="text-xs font-bold text-primary-dark-blue">★</span>
            </div>
        </div>

        <div class="flex-1 min-w-0">
            <h3 class="mb-1.5 break-words font-inter text-lg font-semibold leading-snug text-primary-dark-blue drop-shadow-sm transition-colors duration-300 group-hover:text-primary-yellow sm:text-xl md:mb-2 2xl:text-2xl"
                data-leader-name>
                {{name}}
            </h3>
            <div class="flex flex-wrap items-center gap-1.5 md:gap-2 mb-1.5 md:mb-2">
                <span data-leader-position
                    class="inline-flex items-center px-2 md:px-3 py-1 md:py-1.5 rounded-full text-xs font-bold bg-primary-yellow text-primary-dark-blue shadow-lg">
                    {{position}}
                </span>
            </div>
            <a href="mailto:{{email}}"
                class="inline-flex max-w-full min-w-0 items-start gap-1 text-xs text-primary-dark-blue/80 transition-colors hover:text-primary-yellow md:gap-1.5 md:text-sm">
                <img src="/assets/svgs/icon-mail-outline.svg" alt="Email"
                    class="mt-0.5 h-3.5 w-3.5 shrink-0 md:h-4 md:w-4" />
                <span class="min-w-0 break-words drop-shadow-sm [overflow-wrap:anywhere]">{{email}}</span>
            </a>
        </div>

    </div>
</article>
