<header class="header-wrapper bg-primary-dark-blue">
  <div class="bg-white hidden xl:block">
    <div class="container mx-auto px-4">
      <div class="flex items-center justify-between py-1.5">
        <div
          class="flex flex-row py-0.5 items-center gap-2.5 text-sm"
          data-site-quick-links
        ></div>
        <div class="hidden xl:flex items-center gap-5">
          <a
            href="#"
            class="flex items-center gap-2.5 px-1.5 py-0.5 rounded-[5px] transition-all duration-200 group"
            ><img
              src="/assets/svgs/icon-article.svg"
              alt="E-OFFICE"
              class="w-6 h-6"
            /><span
              class="font-medium text-[14px] text-black group-hover:text-primary-yellow"
              >E-OFFICE</span
            ></a
          >
          <div
            class="flex items-center gap-2.5 px-1.5 py-0.5 rounded-[5px] transition-all duration-200 group"
            data-site-email
          ></div>
          <div
            class="flex items-center gap-2.5 px-1.5 py-0.5 rounded-[5px] transition-all duration-200 group"
            data-site-phone
          ></div>
          <div
            class="language-switcher rounded-full cursor-pointer bg-[#E3F6FD] p-[3px] text-primary-dark-blue px-2 py-1 text-sm flex items-center gap-2"
            data-open-link="en/"
          >
            <p class="language-switcher__text font-semibold">VNI</p>
            <div
              class="language-switcher_img size-5 rounded-full overflow-hidden"
            ></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="bg-primary-dark-blue">
    <div class="container mx-auto px-3 md:px-4">
      <div class="flex items-center justify-between h-20">
        <!-- Logo and site name -->
        <a href="/" data-site-home-link class="flex items-center gap-2 md:gap-3 flex-shrink-0">
          <div class="flex items-center gap-1">
            <img
              src="/assets/svgs/logo.svg"
              alt="IUH Logo"
              class="h-[35px] md:h-[50px] w-auto text-primary-white"
            />
            <img
              src="/assets/svgs/line-logo.svg"
              alt="IUH Logo"
              class="h-[35px] md:h-[50px] w-auto"
            />
          </div>
          <div class="flex flex-col justify-between">
            <div class="flex flex-col gap-1">
              <p data-site-organization-name
                class="text-primary-white font-medium text-xs md:text-base leading-none uppercase tracking-tight"
              >
               
              </p>
              <div class="bg-white h-[1px] md:h-[1.25px] w-full"></div>
              <p data-site-unit-name
                class="text-primary-white font-extrabold text-xs md:text-base leading-none uppercase tracking-tight"
              >
              </p>
            </div>
          </div>
        </a>
       
        <div class="flex shrink-0 items-center gap-1.5 xl:hidden">
          <button
            data-search-trigger
            class="text-primary-white hover:text-primary-yellow transition-colors pr-2 border-r"
            aria-label="Tìm kiếm"
          >
            <img
              src="/assets/svgs/icon-search.svg"
              alt="Search"
              class="w-6 h-6"
            /></button
          ><button
            id="hamburger-menu"
            class="hamburger-menu text-primary-white hover:text-primary-yellow transition-colors"
            aria-label="Mở menu"
          >
            <img src="/assets/svgs/hamburger.svg" alt="Menu" class="w-7 h-7" />
          </button>
        </div>
        <div id="nav-overlay" class="nav-overlay"></div>
        <!-- Mobile-only decorative elements -->
        <div
          class="absolute inset-0 xl:hidden pointer-events-none overflow-hidden"
        >
          <!-- Dynamic mesh background -->
          <div class="absolute w-full h-full opacity-10">
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 10%;
                left: 15%;
                animation-duration: 3s;
                animation-delay: 0s;
              "
            ></div>
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 70%;
                left: 20%;
                animation-duration: 4s;
                animation-delay: -1s;
              "
            ></div>
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 30%;
                left: 60%;
                animation-duration: 5s;
                animation-delay: -2s;
              "
            ></div>
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 80%;
                left: 75%;
                animation-duration: 6s;
                animation-delay: -3s;
              "
            ></div>
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 50%;
                left: 10%;
                animation-duration: 7s;
                animation-delay: -4s;
              "
            ></div>
            <div
              class="absolute size-32 rounded-full border border-white/20 animate-float"
              style="
                top: 15%;
                left: 80%;
                animation-duration: 8s;
                animation-delay: -5s;
              "
            ></div>
          </div>
          <!-- Rotating hexagon -->
          <div
            class="absolute -right-16 -top-16 size-48 animate-spin"
            style="animation-duration: 20s"
          >
            <img
              src="/assets/svgs/hexagon.svg"
              alt=""
              class="w-full h-full text-white/5"
            />
          </div>
          <!-- Floating triangles -->
          <div class="absolute left-1/4 top-1/3">
            <div
              class="relative size-6 rotate-45 bg-white/10 animate-float"
            ></div>
          </div>
          <div class="absolute right-1/3 bottom-1/4">
            <div
              class="relative size-4 -rotate-12 bg-white/5 animate-float"
              style="animation-duration: 5s; animation-delay: -2s"
            ></div>
          </div>
          <!-- Glowing orbs with trails -->
          <div
            class="absolute size-3 animate-move-around"
            style="animation-duration: 20s; animation-delay: -7s"
          >
            <div
              class="absolute size-full rounded-full bg-white/20 blur-sm"
            ></div>
            <div
              class="absolute size-full rounded-full bg-white/10 animate-ping"
              style="animation-duration: 3s; animation-delay: -1s"
            ></div>
          </div>
          <div
            class="absolute size-3 animate-move-around"
            style="
              top: 40%;
              left: 60%;
              animation-duration: 25s;
              animation-delay: -14s;
            "
          >
            <div
              class="absolute size-full rounded-full bg-white/20 blur-sm"
            ></div>
            <div
              class="absolute size-full rounded-full bg-white/10 animate-ping"
              style="animation-duration: 3s; animation-delay: -2s"
            ></div>
          </div>
          <div
            class="absolute size-3 animate-move-around"
            style="
              top: 70%;
              left: 25%;
              animation-duration: 30s;
              animation-delay: -21s;
            "
          >
            <div
              class="absolute size-full rounded-full bg-white/20 blur-sm"
            ></div>
            <div
              class="absolute size-full rounded-full bg-white/10 animate-ping"
              style="animation-duration: 3s; animation-delay: -3s"
            ></div>
          </div>
        </div>
        <nav id="main-nav" class="main-nav xl:flex items-center gap-6">
          <div class="close-header xl:hidden">
            <div class="relative overflow-hidden w-full">
              <div class="absolute inset-0 bg-primary-dark-blue"></div>
              <!-- Background với effects -->
              <div class="absolute inset-0">
                <div
                  class="absolute inset-0 bg-gradient-to-br from-primary-dark-blue via-primary-dark-blue/95 to-primary-dark-blue/90"
                ></div>
                <!-- Circle blob -->
                <div class="absolute -right-8 -top-8 w-32 h-32">
                  <div
                    class="absolute inset-0 bg-white/10 rounded-full blur-2xl animate-pulse"
                  ></div>
                  <img
                    src="/assets/svgs/blob.svg"
                    alt=""
                    class="relative w-full h-full text-white/5"
                  />
                </div>
                <!-- Scattered dots -->
                <div
                  class="absolute h-1 w-1 bg-white/20 rounded-full top-1/4 left-1/4 animate-ping"
                ></div>
                <div
                  class="absolute h-1.5 w-1.5 bg-white/20 rounded-full top-1/3 right-1/3 animate-ping"
                  style="animation-delay: 0.5s"
                ></div>
                <div
                  class="absolute h-1 w-1 bg-white/20 rounded-full bottom-1/4 right-1/4 animate-ping"
                  style="animation-delay: 1s"
                ></div>
                <!-- Abstract lines -->
                <div
                  class="absolute top-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"
                ></div>
                <div
                  class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"
                ></div>
                <div
                  class="absolute -left-10 top-1/2 -rotate-45 w-32 h-px bg-white/10"
                ></div>
                <div
                  class="absolute -right-10 top-1/2 rotate-45 w-32 h-px bg-white/10"
                ></div>
                <!-- Glowing orbs -->
                <div
                  class="absolute left-1/4 top-1/2 w-20 h-20 bg-white/5 rounded-full blur-xl animate-float"
                ></div>
                <div
                  class="absolute right-1/4 bottom-0 w-16 h-16 bg-white/5 rounded-full blur-lg animate-float"
                  style="animation-delay: 1.5s"
                ></div>
              </div>
              <div
                class="relative flex items-center justify-between px-4 py-5 z-10"
              >
              <!-- Site identity (logo and names) -->
                <a href="/" data-site-home-link class="flex items-center gap-2 md:gap-3 flex-shrink-0">
                  <div class="flex items-center gap-1">
                    <img src="/assets/svgs/logo.svg" alt="IUH Logo"
                      class="h-[35px] md:h-[50px] w-auto text-primary-white" />
                    <img src="/assets/svgs/line-logo.svg" alt="IUH Logo" class="h-[35px] md:h-[50px] w-auto" />
                  </div>
                  <div class="flex flex-col justify-between ">
                    <div class="flex flex-col gap-1">
                      <p data-site-organization-name class="text-primary-white font-medium text-xs md:text-base leading-none uppercase tracking-tight"></p>
                      <div class="bg-white h-[1px] md:h-[1.25px] w-full"></div>
                      <p data-site-unit-name class="text-primary-white font-extrabold text-xs md:text-base leading-none uppercase tracking-tight"></p>
                    </div>
                  </div>
                </a>
              
                <button
                  id="close-menu"
                  class="close-menu-btn flex items-center justify-center w-10 h-10 rounded-full bg-white/10"
                  aria-label="Đóng menu"
                >
                  <img
                    src="/assets/svgs/icon-close.svg"
                    alt="Close"
                    class="w-5 h-5 text-primary-white"
                  />
                </button>
              </div>
            </div>
          </div>
          <div
            class="main-nav-container flex flex-col xl:flex-row items-start xl:items-center h-full w-full xl:h-20"
            data-site-primary-nav
          ></div>
          <div
            class="xl:hidden w-full px-4 space-y-3 bg-white rounded-t-3xl pt-6 pb-4 -mt-2"
          >
            <h3
              class="text-sm font-semibold text-primary-dark-blue/60 uppercase tracking-wider px-1"
            >
              Truy cập nhanh
            </h3>
            <div
              class="grid grid-cols-2 gap-3"
              data-site-mobile-quick-links
            ></div>
          </div>
          <button
            data-search-trigger
            class="hidden w-10 h-10 xl:flex items-center justify-center text-primary-yellow xl:hover:bg-white/10 rounded-lg"
            aria-label="Tìm kiếm"
          >
            <img
              src="/assets/svgs/icon-search.svg"
              alt="Search"
              class="w-5 h-5"
            />
          </button>
        </nav>
      </div>
    </div>
  </div>
</header>
