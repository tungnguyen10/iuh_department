<!-- Download Button Component -->
<!-- option 1: Yellow to Dark Blue with Download Icon -->
<a href="{{url}}" download 
  class="group inline-flex items-center gap-2 px-4 py-2.5 bg-primary-yellow hover:bg-primary-dark-blue rounded-lg transition-all duration-300 hover:shadow-md active:scale-95 {{class}}">
  <img src="/assets/svgs/icon-download.svg" alt="" class="w-5 h-5 text-primary-dark-blue group-hover:text-white transition-colors duration-300" />
  <span class="font-roboto font-medium text-sm text-primary-dark-blue group-hover:text-white transition-colors duration-300">{{text}}</span>
</a>

<!-- option 2: Compact full-width - Fixed-height table/list download action -->
<a href="{{url}}" download
  class="group inline-flex h-10 w-full items-center justify-center gap-2 rounded-full bg-primary-yellow px-3 transition-all duration-200 hover:bg-primary-dark-blue hover:shadow-md active:scale-95 focus:outline-none focus:ring-2 focus:ring-primary-yellow focus:ring-offset-2 {{class}}">
  <img src="/assets/svgs/icon-download.svg" alt="" class="h-4 w-4 text-primary-dark-blue group-hover:text-white transition-colors duration-200" />
  <span class="font-roboto text-sm font-semibold text-primary-dark-blue group-hover:text-white transition-colors duration-200">{{text}}</span>
</a>
