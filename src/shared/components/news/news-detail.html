<!-- Shared News Detail Shell - article is injected at build time from selected faculty news.json -->
<section class="container mx-auto px-4 py-8 md:py-12 flex flex-col lg:flex-row gap-12 md:gap-8 {{class}}">
  <div class="flex-1 w-full lg:w-9/12 flex flex-col gap-6 md:gap-10" data-news-detail>
    <article class="bg-white rounded-2xl border border-stroke shadow-sm p-4 md:p-6">
      <p class="font-roboto text-gray-600">Đang tải tin tức...</p>
    </article>
  </div>

  <div class="w-full lg:w-3/12 shrink-0 flex flex-col gap-6 md:gap-8">
    <div data-include="@shared/components/sidebar/news.html" data-class="w-full"></div>
    <div data-include="@shared/components/sidebar/announcements.html" data-class="w-full"></div>
    <div data-include="@shared/components/sidebar/videos.html" data-class="w-full"></div>
  </div>
</section>

<div class="container mx-auto px-4">
  <div data-include="@shared/components/news/news-carousel.html" data-title="{{relatedTitle}}"></div>
</div>
