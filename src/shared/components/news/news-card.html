<!-- option 1: News/Event Card -->
<article
  class="group relative bg-primary-white hover:rounded-[10px] overflow-hidden w-full h-full flex flex-col p-2 md:p-2.5 pb-3 md:pb-4 hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="{{link}}" class="absolute inset-0 z-30" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <!-- Image -->
  <div class="block relative w-full aspect-video rounded-[5px] overflow-hidden mb-2 md:mb-2.5">
    <img src="{{image}}" alt="{{imageAlt}}"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
  </div>
  <div class="px-3 py-1 rounded-md text-xs text-danger bg-danger-light capitalize animate-flash-badge absolute top-3 right-3">
    new
  </div>
  <!-- Content -->
  <div class="flex flex-col flex-1 justify-between w-full">
    <!-- Title and Excerpt -->
    <div class="flex flex-col gap-2 md:gap-2.5">
      <!-- Title -->
      <h3
        class="font-roboto font-medium text-base md:text-lg leading-normal text-title group-hover:text-primary-dark-blue overflow-hidden line-clamp-2 transition-colors duration-300">
        {{title}}
      </h3>

      <!-- Excerpt -->
      <p class="font-roboto font-normal text-sm md:text-base leading-normal text-black overflow-hidden line-clamp-3">
        {{excerpt}}
      </p>
    </div>

    <!-- Bottom section -->
    <div class="flex flex-col gap-3 md:gap-4 mt-auto">
      <!-- Divider -->
      <div class="w-full h-0 border-t border-stroke transition-colors duration-300"></div>

      <!-- Meta and CTA -->
      <div class="flex items-center justify-between">
        <!-- Date Badge -->
        <div
          class="inline-flex items-center gap-1 md:gap-1.5 px-1.5 md:px-2 py-1 md:py-[3px] bg-primary-white border border-danger rounded-[5px] group-hover:bg-danger-light transition-all duration-300">
          <img src="/assets/svgs/icon-calendar-check.svg" alt=""
            class="w-4 h-4 md:w-5 md:h-5 text-danger shrink-0 transition-all duration-300" />
          <span
            class="font-roboto font-medium text-xs md:text-sm leading-normal text-danger transition-colors duration-300">
            {{date}}
          </span>
        </div>

        <!-- CTA -->
        <span
          class="inline-flex items-center gap-[2px] font-roboto font-medium text-sm md:text-base leading-normal text-gray group-hover:text-primary-dark-blue transition-colors duration-300">
          Xem thêm
        </span>
      </div>
    </div>
  </div>
</article>

<!-- option 2: Programme card - news layout with status badge, date row and full-width CTA (data-cta-class sets its colours) -->
<article
  class="group relative bg-primary-white hover:rounded-[10px] overflow-hidden w-full h-full flex flex-col p-2 md:p-2.5 pb-3 md:pb-4 hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <a href="{{link}}" class="absolute inset-0 z-30 rounded-[10px] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-primary-yellow" aria-label="{{title}} – {{cta}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <div class="block relative w-full aspect-video rounded-[5px] overflow-hidden mb-2 md:mb-2.5">
    <img src="{{image}}" alt="{{imageAlt}}" loading="lazy" decoding="async"
      class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 motion-reduce:transform-none" />
    <span class="absolute left-2.5 top-2.5 rounded-md px-2.5 py-1 font-roboto text-xs font-bold shadow-sm {{statusClass}}">{{status}}</span>
  </div>

  <div class="flex flex-col flex-1 justify-between w-full px-1">
    <div class="flex flex-col gap-2 md:gap-2.5">
      <p class="font-roboto text-xs font-bold uppercase tracking-[0.12em] text-primary-dark-blue">{{category}}</p>
      <h3 class="font-roboto font-medium text-base md:text-lg leading-normal text-title group-hover:text-primary-dark-blue overflow-hidden line-clamp-2 transition-colors duration-300">{{title}}</h3>
      <p class="font-roboto font-normal text-sm md:text-base leading-normal text-black overflow-hidden line-clamp-3">{{excerpt}}</p>
    </div>

    <div class="mt-auto pt-3 md:pt-4">
      <p class="flex items-center justify-between gap-2 border-t border-stroke pt-3 md:pt-4">
        <span class="inline-flex min-w-0 items-center gap-1.5 font-roboto text-xs font-bold uppercase tracking-[0.1em] text-gray">
          <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="size-4 shrink-0 text-primary-dark-blue" />{{dateLabel}}
        </span>
        <span class="whitespace-nowrap font-inter text-sm font-bold text-title md:text-base">{{date}}</span>
      </p>
      <span class="mt-3 flex w-full items-center justify-center gap-1.5 whitespace-nowrap rounded-full py-2 font-roboto text-sm font-semibold transition-colors duration-300 {{ctaClass}}">
        {{cta}}
        <img src="/assets/svgs/icon-arrow-up-right.svg" alt="" class="size-4 shrink-0 transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 motion-reduce:transform-none" />
      </span>
    </div>
  </div>
</article>
