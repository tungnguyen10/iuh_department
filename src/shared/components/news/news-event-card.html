<!-- News/Event Card Component - Horizontal Layout -->
<!-- Large card with image and content side by side -->
<article
  class="group relative bg-white border border-stroke rounded-[5px] md:rounded-[8px] shadow-[1px_1px_10px_0_rgba(0,0,0,0.1)] p-2 md:p-2.5 w-full hover:border-secondary-blue hover:rounded-[8px] md:hover:rounded-lg hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="{{link}}"
    class="absolute inset-0 z-30 rounded-[5px] md:rounded-[8px] group-hover:rounded-[8px] md:group-hover:rounded-lg"
    aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <!-- Content Container -->
  <div class="flex flex-col md:flex-row gap-2 md:gap-2.5 h-full">
    <!-- Image -->
    <div
      class="relative shrink-0 w-full md:w-[240px] lg:w-[280px] h-[180px] md:h-[150px] lg:h-[170px] rounded-[5px] overflow-hidden">
      <img src="{{image}}" alt="{{imageAlt}}"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
    </div>
    <div
      class="px-3 py-1 rounded-md text-xs text-danger bg-danger-light capitalize animate-flash-badge absolute top-3 right-3 md:left-3 md:right-auto">
      new
    </div>
    <!-- Text Content -->
    <div class="flex-1 flex flex-col justify-between py-0 md:py-1.5 min-w-0">
      <!-- Top Section: Title + Description -->
      <div class="flex flex-col gap-2 md:gap-2.5">
        <!-- Title -->
        <h3
          class="font-roboto font-medium text-base md:text-lg leading-normal text-gray-900 line-clamp-2 group-hover:text-primary-dark-blue transition-colors duration-200">
          {{title}}
        </h3>

        <!-- Description -->
        <p class="font-roboto font-normal text-sm md:text-base leading-normal text-gray-700 line-clamp-2">
          {{description}}
        </p>
      </div>

      <!-- Bottom Section: Divider + Date + Link -->
      <div class="flex flex-col gap-2 md:gap-2.5 mt-2 md:mt-0">
        <!-- Divider Line -->
        <div class="w-full h-px bg-stroke"></div>

        <!-- Date Badge + "Xem thêm" Link -->
        <div class="flex items-center justify-between">
          <!-- Date Badge -->
          <div
            class="inline-flex items-center gap-1 md:gap-1.5 px-1.5 py-0.5 bg-white border border-danger rounded-[5px]">
            <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="w-4 h-4 md:w-5 md:h-5 shrink-0 text-danger" />
            <span class="font-roboto font-medium text-xs md:text-sm leading-normal text-danger">{{date}}</span>
          </div>

          <!-- "Xem thêm" Link -->
          <span
            class="font-roboto font-medium text-sm md:text-base leading-normal text-gray-600 group-hover:text-primary-dark-blue transition-colors duration-200">
            Xem thêm
          </span>
        </div>
      </div>
    </div>
  </div>
</article>
