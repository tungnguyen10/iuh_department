<!-- Sidebar News Component - Complete with Header and Sample Cards -->
<aside class="flex flex-col gap-3 md:gap-4 w-full {{class}}">
  <!-- Header -->
  <div data-include="@shared/components/common/child-title.html"
       data-title="TIN TỨC MỚI">
  </div>

  <!-- News Cards Container -->
  <div class="flex flex-col gap-2 md:gap-2.5">
    <!-- Featured News Card -->
    <div data-include="@shared/components/sidebar/news-card-featured.html"
         data-image="/assets/images/default.jpg"
         data-image-alt="Hội đồng bảo vệ khóa luận"
         data-title="Danh sách hội đồng và sinh viên bảo vệ khóa luận tốt nghiệp HK1 (2025-2026)"
         data-link="/news.html"
         data-date="12 tháng 5, 2025">
    </div>

    <!-- Compact News Cards -->
    <div data-include="@shared/components/sidebar/news-card-compact.html"
         data-image="/assets/images/default.jpg"
         data-image-alt="Lễ tốt nghiệp"
         data-title="Thông báo sinh viên đăng ký dự lễ tốt nghiệp năm 2025"
         data-link="/news.html"
         data-date="10 tháng 5, 2025">
    </div>

    <div data-include="@shared/components/sidebar/news-card-compact.html"
         data-image="/assets/images/default.jpg"
         data-image-alt="Học bổng"
         data-title="Thông báo về việc nộp và báo cáo môn học Thiết kế hệ thống thông gió và ĐHKK"
         data-link="/news.html"
         data-date="12 tháng 5, 2025">
    </div>

    <div data-include="@shared/components/sidebar/news-card-compact.html"
         data-image="/assets/images/default.jpg"
         data-image-alt="Thi cuối kỳ"
         data-title="Thông báo sinh viên đăng ký dự lễ tốt nghiệp năm 2025"
         data-link="/news.html"
         data-date="12 tháng 5, 2025">
    </div>
  </div>
</aside>
