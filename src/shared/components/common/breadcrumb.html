<!-- Breadcrumb Component -->
<!-- Supports up to 3 levels: Home / Parent1 / Parent2 / Current -->
<!-- Omit parent props for simpler breadcrumbs -->
<nav class="w-full bg-secondary-blue-light py-3 {{class}}">
    <div class="container mx-auto px-4">
        <div class="flex items-center text-sm md:text-base leading-normal">
            <a href="/"
                class="font-roboto font-normal text-gray-700 hover:text-primary-dark-blue transition-colors duration-200 shrink-0">
                Trang chủ
            </a>

            <!-- Separator / Parent Level 1 (optional) -->

            <a href="{{parentLink1}}"
                class="font-roboto font-normal text-gray-700 hover:text-primary-dark-blue transition-colors duration-200 line-clamp-1 shrink-0 {{parentPage1Class}}">
                <span class="font-roboto font-medium text-gray-700 mx-2">/</span>{{parentPage1}}</a>


            <!-- Separator / Parent Level 2 (optional) -->

            <a href="{{parentLink2}}"
                class="font-roboto font-normal text-gray-700 hover:text-primary-dark-blue transition-colors duration-200 line-clamp-1 shrink-0 {{parentPage2Class}}">
                <span class="font-roboto font-medium text-gray-700 mx-2">/</span>{{parentPage2}}</a>


            <!-- Separator / Current Page -->

            <p class="font-roboto font-normal text-primary-dark-blue line-clamp-1">
                <span class="font-roboto font-medium text-gray-700 mx-2">/</span>{{currentPage}}
            </p>
        </div>
    </div>
</nav>
