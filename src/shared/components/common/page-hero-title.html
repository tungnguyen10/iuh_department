<!-- Page Hero Title Component -->
<!-- Eyebrow + H1 + side-by-side description for page heroes (login, lookup, ...) -->
<!-- Optional: data-eyebrow, data-description, data-class, data-eyebrow-class, data-title-class, data-description-class -->
<div class="mb-6 flex flex-col gap-3 md:mb-8 md:flex-row md:items-end md:justify-between {{class}}">
  <div>
    <p class="font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-dark-blue {{eyebrowClass}}">{{eyebrow}}</p>
    <h1 class="mt-2 font-inter text-4xl font-extrabold leading-tight text-primary-dark-blue md:text-5xl {{titleClass}}">{{title}}</h1>
  </div>
  <p class="max-w-xl font-roboto text-sm leading-relaxed text-gray-700 md:text-base {{descriptionClass}}">{{description}}</p>
</div>
