<!-- Article Detail Component -->
<!-- Full article/news detail page layout -->
<article class="bg-white rounded-[10px] shadow-[1px_1px_10px_0_rgba(0,0,0,0.1)] px-6 pt-6 pb-8 {{class}}">
  <!-- Header Section -->
  <div class="flex flex-col gap-4 mb-5">
    <!-- Top Bar: Date + Actions -->
    <div class="flex items-start justify-between flex-wrap gap-4">
      <!-- Date Badge -->
      <div class="inline-flex items-center gap-1.5 px-1.5 py-0.5 bg-white border border-danger rounded-[5px]">
        <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="w-5 h-5 shrink-0" />
        <span class="font-roboto font-medium text-sm leading-normal text-danger">{{date}}</span>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-4">
        <!-- Share Button -->
        <button type="button" class="js-share-btn group inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-light hover:bg-primary-dark-blue rounded-[5px] transition-all duration-300 hover:scale-105 hover:shadow-md active:scale-95 active:animate-jelly">
          <img src="/assets/svgs/icon-share.svg" alt="" class="w-5 h-5 shrink-0 transition-transform duration-300 group-hover:scale-110 group-active:rotate-12" />
          <span class="font-roboto font-medium text-sm text-gray-700 group-hover:text-white transition-colors duration-300">Share</span>
        </button>

        <!-- Copy Link Button -->
        <button type="button" class="js-copy-link-btn group inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-light hover:bg-primary-yellow rounded-[5px] transition-all duration-300 hover:scale-105 hover:shadow-md active:scale-95 active:animate-jelly">
          <img src="/assets/svgs/icon-copy.svg" alt="" class="w-5 h-5 shrink-0 transition-transform duration-300 group-hover:scale-110 group-active:-rotate-12" />
          <span class="font-roboto font-medium text-sm text-gray-700 group-hover:text-primary-dark-blue transition-colors duration-300">Copy link</span>
        </button>
      </div>
    </div>

    <!-- Divider -->
    <div class="w-full h-px bg-stroke"></div>

    <!-- Title -->
    <h1 class="font-inter font-bold text-2xl leading-normal text-primary-dark-blue">
      {{title}}
    </h1>
  </div>

  <!-- Featured Image -->
  <div class="relative w-full h-[300px] rounded-[5px] overflow-hidden mb-5">
    <img src="{{image}}" alt="{{imageAlt}}" class="w-full h-full object-cover" />
  </div>

  <!-- Article Body Content -->
  <div class="font-roboto font-normal text-base leading-[30px] text-gray-700 text-justify prose prose-lg max-w-none">
    {{content}}
  </div>
</article>
