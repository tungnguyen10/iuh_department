<!-- Shared weekly calendar; runtime wiring lives in shared.config.js. -->
<section id="weekly-schedule" data-weekly-calendar data-initial-week="08/09/2026" aria-label="{{title}}" class="flex min-w-0 scroll-mt-32 flex-col {{class}}">
  <div class="mb-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <div data-include="@shared/components/common/section-title.html"
        data-title="{{title}}"
        data-title-class="!leading-tight text-primary-dark-blue">
      </div>
      <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/calendar.html" data-text="Xem lịch đầy đủ" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="shrink-0 motion-reduce:transition-none {{fullLinkClass}}" data-icon-class="motion-reduce:transform-none motion-reduce:transition-none"></div>
    </div>
    <p class="mt-2 text-sm leading-6 text-black md:text-base">Lịch công tác, sự kiện và phòng họp</p>
  </div>

  <div class="rounded-2xl border border-primary-dark-blue/10 bg-primary-white p-4 sm:p-5">
    <div role="group" aria-label="Loại lịch" class="grid grid-cols-3 gap-1 rounded-xl bg-secondary-blue-light/50 p-1">
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=all aria-pressed=true" data-text="Lịch công tác" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=deadline aria-pressed=false" data-text="Hạn xử lý" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=room aria-pressed=false" data-text="Phòng họp" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
    </div>
    <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-b border-stroke pb-4">
      <time data-schedule-week datetime="2026-09-08" class="font-inter text-sm font-bold leading-6 text-primary-dark-blue sm:text-base">08 – 14 Tháng 9, 2026</time>
      <div class="flex items-center gap-2" role="group" aria-label="Chọn tuần">
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-shift=-1" data-text="Tuần trước" data-icon="/assets/svgs/icon-chevron-left.svg" data-class="h-11 w-11 shrink-0 rounded-xl p-0 md:p-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow motion-reduce:transition-none [&_span]:sr-only" data-icon-class="h-5 w-5 md:h-5 md:w-5 group-hover:translate-x-0 group-hover:translate-y-0 motion-reduce:transition-none"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-shift=1" data-text="Tuần sau" data-icon="/assets/svgs/icon-chevron-right.svg" data-class="h-11 w-11 shrink-0 rounded-xl p-0 md:p-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow motion-reduce:transition-none [&_span]:sr-only" data-icon-class="h-5 w-5 md:h-5 md:w-5 group-hover:translate-x-0 group-hover:translate-y-0 motion-reduce:transition-none"></div>
      </div>
    </div>
    <p data-schedule-status role="status" class="sr-only">Lịch công tác: 4 mục. 08 – 14 Tháng 9, 2026.</p>
    <ul data-schedule-list aria-label="Sự kiện trong tuần" class="pt-1">
      <li data-schedule-event data-schedule-date="09/09/2026" data-schedule-start="08:00" data-schedule-end="10:00" data-schedule-type="meeting" data-schedule-room="true" data-schedule-title="Họp giao ban Ban Giám hiệu" data-schedule-location="Phòng E3.2" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="10/09/2026" data-schedule-start="17:00" data-schedule-type="deadline" data-schedule-room="false" data-schedule-title="Hạn nộp hồ sơ thi đua" data-schedule-location="Trực tuyến" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="11/09/2026" data-schedule-start="13:30" data-schedule-end="16:30" data-schedule-type="conference" data-schedule-room="true" data-schedule-title="Hội nghị viên chức năm 2026" data-schedule-location="Hội trường A" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="12/09/2026" data-schedule-start="09:00" data-schedule-end="11:30" data-schedule-type="training" data-schedule-room="true" data-schedule-title="Đào tạo kỹ năng hành chính" data-schedule-location="Phòng B4.1" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="15/09/2026" data-schedule-start="08:00" data-schedule-end="10:00" data-schedule-type="meeting" data-schedule-room="true" data-schedule-title="Họp giao ban Ban Giám hiệu" data-schedule-location="Phòng E3.2" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="16/09/2026" data-schedule-start="17:00" data-schedule-type="deadline" data-schedule-room="false" data-schedule-title="Hạn nộp hồ sơ thi đua" data-schedule-location="Trực tuyến" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="17/09/2026" data-schedule-start="13:30" data-schedule-end="16:30" data-schedule-type="conference" data-schedule-room="true" data-schedule-title="Hội nghị viên chức năm 2026" data-schedule-location="Hội trường A" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="17/09/2026" data-schedule-start="09:00" data-schedule-end="11:30" data-schedule-type="training" data-schedule-room="true" data-schedule-title="Đào tạo kỹ năng hành chính" data-schedule-location="Phòng B4.1" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
    </ul>
    <div data-schedule-empty hidden class="hidden py-12 text-center">
      <p class="font-inter text-base font-semibold text-title">Chưa có lịch phù hợp trong tuần này</p>
      <p class="mt-2 text-sm leading-6 text-black">Chọn tuần khác hoặc xem mục Lịch công tác.</p>
    </div>
  </div>
</section>
