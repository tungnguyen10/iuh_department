<!-- Shared weekly calendar; runtime wiring lives in shared.config.js. -->
<section id="weekly-schedule" data-weekly-calendar data-initial-week="28/09/2026" aria-label="{{title}}" class="flex min-w-0 scroll-mt-32 flex-col {{class}}">
  <div class="mb-5">
    <div data-include="@shared/components/common/section-title.html" data-title="{{title}}" data-title-class="!leading-tight text-primary-dark-blue"></div>
    <p class="mt-2 text-sm leading-6 text-black md:text-base">Theo dõi các phòng họp đã được đăng ký sử dụng.</p>
  </div>

  <div class="rounded-2xl border border-primary-dark-blue/10 bg-primary-white p-4 sm:p-5">
    <div role="group" aria-label="Lọc theo phòng họp" class="overflow-x-auto rounded-xl bg-secondary-blue-light/50 p-1">
      <div class="grid min-w-[33rem] grid-cols-4 gap-1">
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=all aria-pressed=true" data-text="Tất cả phòng" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=room-1 aria-pressed=false" data-text="Phòng họp 1" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=room-2 aria-pressed=false" data-text="Phòng họp 2" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-filter=room-3 aria-pressed=false" data-text="Phòng họp 3" data-icon="/assets/svgs/icon-calendar-check.svg" data-class="min-h-11 w-full rounded-lg border-transparent bg-transparent px-1.5 py-2 text-xs text-black hover:border-transparent hover:bg-primary-white hover:text-primary-dark-blue hover:shadow-none focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow md:px-2 md:text-sm motion-reduce:transition-none [&[aria-pressed=true]]:border-primary-dark-blue/10 [&[aria-pressed=true]]:bg-primary-white [&[aria-pressed=true]]:text-primary-dark-blue [&[aria-pressed=true]]:shadow-sm" data-icon-class="hidden"></div>
      </div>
    </div>
    <div class="mt-4 flex flex-wrap items-center justify-between gap-3 border-b border-stroke pb-4">
      <time data-schedule-week datetime="2026-09-28" class="font-inter text-sm font-bold leading-6 text-primary-dark-blue sm:text-base">28/09 – 04/10/2026</time>
      <div class="flex items-center gap-2" role="group" aria-label="Chọn tuần">
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-shift=-1" data-text="Tuần trước" data-icon="/assets/svgs/icon-chevron-left.svg" data-class="h-11 w-11 shrink-0 rounded-xl p-0 md:p-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow motion-reduce:transition-none [&_span]:sr-only" data-icon-class="h-5 w-5 md:h-5 md:w-5 group-hover:translate-x-0 group-hover:translate-y-0 motion-reduce:transition-none"></div>
        <div data-include="@shared/components/button/button.html" data-variant="9" data-type="button" data-attrs="data-schedule-shift=1" data-text="Tuần sau" data-icon="/assets/svgs/icon-chevron-right.svg" data-class="h-11 w-11 shrink-0 rounded-xl p-0 md:p-0 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow motion-reduce:transition-none [&_span]:sr-only" data-icon-class="h-5 w-5 md:h-5 md:w-5 group-hover:translate-x-0 group-hover:translate-y-0 motion-reduce:transition-none"></div>
      </div>
    </div>
    <p data-schedule-status role="status" class="sr-only">Tất cả phòng: 3 mục. 28/09 – 04/10/2026.</p>
    <ul data-schedule-list aria-label="Lịch đặt phòng trong tuần" class="pt-1">
      <li data-schedule-event data-schedule-date="03/10/2026" data-schedule-start="08:00" data-schedule-end="11:30" data-schedule-type="meeting" data-schedule-room="true" data-schedule-room-id="room-2" data-schedule-title="Hội đồng nghiệm thu giáo trình" data-schedule-location="Phòng họp 2" data-schedule-unit="Khoa Thương mại – Du lịch" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="03/10/2026" data-schedule-start="13:30" data-schedule-end="17:00" data-schedule-type="meeting" data-schedule-room="true" data-schedule-room-id="room-1" data-schedule-title="Hội đồng đánh giá luận án tiến sĩ cấp đơn vị chuyên môn" data-schedule-location="Phòng họp 1" data-schedule-unit="Khoa Công nghệ Cơ khí" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="03/10/2026" data-schedule-start="15:30" data-schedule-end="17:30" data-schedule-type="conference" data-schedule-room="true" data-schedule-room-id="room-3" data-schedule-title="Hội nghị kiện toàn Ban Chấp hành Đoàn khoa Khoa học Sức khỏe" data-schedule-location="Phòng họp 3" data-schedule-unit="Khoa Khoa học Sức khỏe" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="05/10/2026" data-schedule-start="07:00" data-schedule-end="11:30" data-schedule-type="meeting" data-schedule-room="true" data-schedule-room-id="room-3" data-schedule-title="Hội đồng xét duyệt đề cương đề án tốt nghiệp Thạc sĩ ngành TCNH" data-schedule-location="Phòng họp 3" data-schedule-unit="Viện Tài chính – Kế toán" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="05/10/2026" data-schedule-start="13:30" data-schedule-end="14:30" data-schedule-type="conference" data-schedule-room="true" data-schedule-room-id="room-1" data-schedule-title="Hội nghị chuyên đề TTTV – NXB" data-schedule-location="Phòng họp 1" data-schedule-unit="Trung tâm Thư viện" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="06/10/2026" data-schedule-start="08:00" data-schedule-end="17:00" data-schedule-type="meeting" data-schedule-room="true" data-schedule-room-id="room-1" data-schedule-title="Kiểm tra kế hoạch giảng viên năm học 2026 – 2027" data-schedule-location="Phòng họp 1" data-schedule-unit="Phòng Tổ chức – Hành chính" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
      <li data-schedule-event data-schedule-date="07/10/2026" data-schedule-start="09:00" data-schedule-end="11:30" data-schedule-type="conference" data-schedule-room="true" data-schedule-room-id="room-3" data-schedule-title="Hội thảo chuyên đề từ chuyên gia quốc tế – Khoa QTKD" data-schedule-location="Phòng họp 3" data-schedule-unit="Khoa Quản trị Kinh doanh" class="relative grid grid-cols-[2.75rem_0.75rem_minmax(0,1fr)] gap-x-3 py-4 sm:grid-cols-[3.25rem_0.75rem_minmax(0,1fr)] sm:gap-x-4"></li>
    </ul>
    <div data-schedule-empty hidden class="hidden py-12 text-center">
      <p class="font-inter text-base font-semibold text-title">Chưa có lịch đặt phòng trong tuần này</p>
      <p class="mt-2 text-sm leading-6 text-black">Chọn tuần hoặc phòng họp khác để xem lịch.</p>
    </div>
  </div>
</section>
