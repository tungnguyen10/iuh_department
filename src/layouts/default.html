<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- Primary Meta Tags -->
  <title>{{title}} - Lab IUH</title>
  <meta name="title" content="{{title}} - Lab IUH">
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <meta name="author" content="Lab IUH">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{title}} - Lab IUH">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{ogImage}}">
  
  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="{{url}}">
  <meta property="twitter:title" content="{{title}} - Lab IUH">
  <meta property="twitter:description" content="{{description}}">
  <meta property="twitter:image" content="{{ogImage}}">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#2563eb">
  <meta name="msapplication-TileColor" content="#2563eb">
  
  
  <script type="module" src="../main.js"></script>
</head>
<body class="flex flex-col min-h-screen loading-active" >
  
  <!-- Global Loading Overlay - Render FIRST -->
  {{loadingComponent}}
  
  <!-- Header Component -->
  <div data-include="../components/header/header.html" data-js="../components/header/header.js"></div>
  
  <!-- Main Content -->
  <main class="flex-1">
    {{content}}
  </main>
  
  <!-- Footer Component -->
  <div data-include="../components/footer/footer.html" data-js="../components/footer/footer.js"></div>
  
  <!-- Search Modal Component (Global) -->
  <div data-include="../components/search/search-modal-full.html"></div>
  
  <!-- Scroll to Top Button -->
  <button id="scrollToTop" 
    class="size-12 fixed bottom-4 right-2 md:bottom-6 md:right-6 z-50 bg-primary-dark-blue hover:bg-primary-yellow text-white rounded-full shadow-lg transition-all duration-300 flex items-center justify-center opacity-0 invisible" 
    aria-label="Scroll to top">
    <svg class="size-5 md:size-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
    </svg>
  </button>

  <!-- Social Icons -->
  <div class="fixed bottom-4 left-4 md:bottom-8 md:left-8 z-50">
    <div class="relative">
      <!-- Toggle Button -->
      <button id="socialToggle" 
        class="w-12 h-12 bg-primary-dark-blue hover:bg-primary-yellow text-white rounded-full shadow-lg transition-all duration-300 flex items-center justify-center relative" 
        aria-label="Show Social Links">
        <svg class="w-6 h-6 relative z-[3]" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 17H12.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Social Icons List -->
      <div id="socialList" class="absolute bottom-full left-0 mb-4 space-y-3 opacity-0 invisible transition-all duration-300">
        <!-- Facebook -->
        <div class="group relative">
          <a href="https://www.facebook.com/iuh.official" target="_blank" rel="noopener noreferrer" 
            class="social-icon w-12 h-12 flex items-center justify-center bg-[#1877F2] text-white rounded-full shadow-lg transition-all duration-300 hover:scale-110 -translate-y-4 opacity-0">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </a>
          <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <div class="relative bg-[#1877F2] px-3 py-1.5 rounded-lg shadow-lg transform -translate-x-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-x-0 transition-all duration-300">
              <span class="block text-sm font-medium text-white whitespace-nowrap">Facebook</span>
              <div class="absolute left-0 top-1/2 -translate-x-[6px] -translate-y-1/2 transform rotate-45 w-3 h-3 bg-[#1877F2]"></div>
            </div>
          </div>
        </div>

        <!-- Youtube -->
        <div class="group relative">
          <a href="https://www.youtube.com/@iuh.official" target="_blank" rel="noopener noreferrer" 
            class="social-icon w-12 h-12 flex items-center justify-center bg-[#FF0000] text-white rounded-full shadow-lg transition-all duration-300 hover:scale-110 -translate-y-4 opacity-0">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </a>
          <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <div class="relative bg-[#FF0000] px-3 py-1.5 rounded-lg shadow-lg transform -translate-x-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-x-0 transition-all duration-300">
              <span class="block text-sm font-medium text-white whitespace-nowrap">Youtube</span>
              <div class="absolute left-0 top-1/2 -translate-x-[6px] -translate-y-1/2 transform rotate-45 w-3 h-3 bg-[#FF0000]"></div>
            </div>
          </div>
        </div>

        <!-- Instagram -->
        <div class="group relative">
          <a href="https://www.instagram.com/iuh.official" target="_blank" rel="noopener noreferrer" 
            class="social-icon w-12 h-12 flex items-center justify-center bg-gradient-to-br from-[#833AB4] via-[#FD1D1D] to-[#FCAF45] text-white rounded-full shadow-lg transition-all duration-300 hover:scale-110 -translate-y-4 opacity-0">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
            </svg>
          </a>
          <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <div class="relative bg-gradient-to-r from-[#833AB4] to-[#FD1D1D] px-3 py-1.5 rounded-lg shadow-lg transform -translate-x-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-x-0 transition-all duration-300">
              <span class="block text-sm font-medium text-white whitespace-nowrap">Instagram</span>
              <div class="absolute left-0 top-1/2 -translate-x-[6px] -translate-y-1/2 transform rotate-45 w-3 h-3 bg-[#833AB4]"></div>
            </div>
          </div>
        </div>

        <!-- Phone -->
        <div class="group relative">
          <a href="tel:+842838940390" 
            class="social-icon w-12 h-12 flex items-center justify-center bg-[#25D366] text-white rounded-full shadow-lg transition-all duration-300 hover:scale-110 -translate-y-4 opacity-0">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z"/>
            </svg>
          </a>
          <div class="absolute left-full ml-3 top-1/2 -translate-y-1/2 pointer-events-none">
            <div class="relative bg-[#25D366] px-3 py-1.5 rounded-lg shadow-lg transform -translate-x-2 opacity-0 invisible group-hover:opacity-100 group-hover:visible group-hover:translate-x-0 transition-all duration-300">
              <span class="block text-sm font-medium text-white whitespace-nowrap">0283 8940 390</span>
              <div class="absolute left-0 top-1/2 -translate-x-[6px] -translate-y-1/2 transform rotate-45 w-3 h-3 bg-[#25D366]"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  {{pageScript}}
</body>
</html>
