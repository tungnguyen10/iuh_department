<!-- News/Notification Card - Text Only Variant -->
<!-- Usage: 
  data-title="..."
  data-link="/news/1"
  data-date="2025-05-12"
  data-dateText="12 tháng 5, 2025"
-->
<article class="flex flex-col gap-1.5 w-full border-t border-gray-300 pt-1.5 {{class}}">
  <a href="{{link}}" class="flex flex-col gap-2.5 hover:opacity-80 transition-opacity duration-200">
    <h3 class="font-roboto font-medium text-base text-gray-900 leading-normal line-clamp-3">
      {{title}}
    </h3>
    <div class="inline-flex items-center gap-1.5 bg-danger-light rounded-md px-1.5 py-1 self-start">
      <img src="@assets/svgs/icon-calendar-check.svg" alt="" class="w-5 h-5 shrink-0 text-danger">
      <time class="font-roboto font-medium text-sm text-danger leading-normal" datetime="{{date}}">
        {{dateText}}
      </time>
    </div>
  </a>
</article>
