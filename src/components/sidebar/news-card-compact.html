<!-- Sidebar News/Announcement Card - Compact -->
<!-- With image: horizontal layout (thumbnail + text) -->
<!-- Without image: vertical layout (text only) - omit data-image prop -->
<article class="group flex flex-col gap-1 md:gap-1.5 w-full {{class}}">
  <!-- Divider Line -->
  <div class="w-full h-px bg-stroke"></div>

  <!-- Content -->
  <div class="relative flex gap-2 md:gap-2.5 bg-[#FAFAFA] border border-stroke rounded-[5px] md:rounded-[8px] p-2 md:p-2.5 hover:bg-white hover:border-secondary-blue hover:rounded-[8px] md:hover:rounded-lg hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer">
    <!-- Absolute Link Overlay for Full Card Clickability -->
    <a href="{{link}}" class="absolute inset-0 z-30 rounded-[5px] md:rounded-[8px] group-hover:rounded-[8px] md:group-hover:rounded-lg" aria-label="{{title}}">
      <span class="sr-only">{{title}}</span>
    </a>

    <!-- Thumbnail (85x85) - Will be hidden if image prop is empty -->
    <div class="relative shrink-0 w-[70px] h-[70px] md:w-[85px] md:h-[85px] rounded-[5px] overflow-hidden {{imageClass}}">
      <img src="{{image}}" alt="{{imageAlt}}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
    </div>

    <!-- Text Content -->
    <div class="flex-1 flex flex-col gap-2 md:gap-2.5 min-w-0">
      <!-- Title -->
      <h3 class="font-roboto font-medium text-sm md:text-base leading-normal text-gray-900 group-hover:text-primary-dark-blue transition-colors duration-200 line-clamp-2 overflow-hidden text-ellipsis">
        {{title}}
      </h3>

      <!-- Date Badge -->
      <div class="inline-flex items-center gap-1 md:gap-1.5 bg-danger-light rounded-[5px] px-1.5 py-[3px] self-start">
        <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="w-4 h-4 md:w-5 md:h-5 text-danger">
        <span class="font-roboto font-medium text-xs md:text-sm text-danger">{{date}}</span>
      </div>
    </div>
  </div>
</article>
