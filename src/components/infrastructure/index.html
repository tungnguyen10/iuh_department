<!-- Infrastructure Section Component -->
<section id="infrastructure-section" class="w-full bg-gradient-to-b from-secondary-blue-light to-primary-white py-12 sm:py-16 md:py-20 lg:py-24">
    <div class="container mx-auto px-4 ">
        <!-- Single Grid Container for all items -->
        <div class="grid grid-cols-12 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 md:gap-5">
            <!-- Left Content Block - Desktop: col 1, row 1 / Mobile: full row -->
            <div class="col-span-12 sm:col-span-2 lg:col-span-1 flex flex-col gap-3 sm:gap-4 pr-0 lg:pr-4 py-4 sm:py-5 md:py-6 lg:py-8 lg:col-start-1 lg:row-start-1">

                    Cơ sở vật chất
                </h2>
                <p class="font-roboto font-normal text-sm sm:text-base md:text-base lg:text-lg leading-relaxed text-black text-justify">
                    Hệ thống cơ sở vật chất khang trang, trang thiết bị hiện đại, phục vụ hiệu quả cho đào tạo, nghiên cứu và phát triển chuyên môn trong lĩnh vực sức khỏe.
                </p>
            </div>

            <!-- Image Card 1 - Mobile: 4 cols (1/3) -->
            <div data-include="@components/infrastructure/infrastructure-card.html" 
                data-image="/assets/images/activities-1.jpg"

                data-link="/"
                data-class="col-span-4 sm:col-span-1 lg:col-start-2 lg:row-start-1"></div>

            <!-- Image Card 2 - Mobile: 8 cols (2/3) -->

                data-link="/"
                data-class="col-span-8 sm:col-span-1 lg:col-start-3 lg:row-start-1"></div>

            <!-- Image Card 3 - Mobile: 8 cols (2/3) -->
            <div data-include="@components/infrastructure/infrastructure-card.html"
