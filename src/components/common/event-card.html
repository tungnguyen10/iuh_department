<!-- Event Card Component -->
<article class="group relative bg-[#FAFAFA] border border-stroke rounded-md h-28 sm:h-32 md:h-[120px] p-2 sm:p-2.5 w-full hover:bg-white hover:border-secondary-blue hover:rounded-lg hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="{{link}}" class="absolute inset-0 z-30 rounded-md group-hover:rounded-lg" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <!-- Content -->
  <div class="flex gap-3 sm:gap-4 md:gap-5 h-full">
    <!-- Thumbnail -->
    <div class="shrink-0 aspect-square rounded-md overflow-hidden">
      <img src="{{image}}" alt="{{imageAlt}}" class="w-full h-full object-cover" />
    </div>

    <!-- Text Content -->
    <div class="flex-1 flex flex-col justify-between min-w-0">
      <!-- Title - Hidden on hover -->
      <h3 class="font-roboto font-medium text-base sm:text-lg leading-normal text-gray-900 truncate ">
        {{title}}
      </h3>

      <!-- Badges -->
      <div class="flex items-start justify-between gap-2 sm:gap-2.5 flex-wrap">
        <!-- Left badges column -->
        <div class="flex flex-col gap-2 sm:gap-2.5">
          <!-- Type Badge (filled) -->
          <div class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-primary-dark-blue border border-primary-dark-blue rounded">
            <img src="{{typeIcon}}" alt="" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-primary-white" />
            <span class="font-roboto font-medium text-xs sm:text-sm leading-normal text-white">{{typeBadge}}</span>
          </div>

          <!-- Location Badge (outline) -->
          <div class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-white group-hover:bg-secondary-blue-light border border-primary-dark-blue rounded transition-colors duration-300">
            <img src="{{locationIcon}}" alt="" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-primary-dark-blue" />
            <span class="font-roboto font-medium text-xs sm:text-sm leading-normal text-primary-dark-blue">{{locationBadge}}</span>
          </div>
        </div>

        <!-- Right badge (Date) -->
        <div class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-white group-hover:bg-secondary-blue-light border border-primary-dark-blue rounded transition-colors duration-300">
          <img src="{{dateIcon}}" alt="" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-primary-dark-blue" />
          <span class="font-roboto font-medium text-xs sm:text-sm leading-normal text-primary-dark-blue">{{dateBadge}}</span>
        </div>
      </div>
    </div>
  </div>
</article>
