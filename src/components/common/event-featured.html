<!-- Event Featured Image with Navigation Component -->
<div class="relative w-full h-56 sm:h-64 md:h-72 lg:h-80 group {{class}}">
  <!-- Featured Background Image (Dynamic - syncs with carousel) -->
  <div class="w-full h-full relative rounded-lg overflow-hidden bg-gray-100">
    <img src="{{image}}" alt="{{imageAlt}}"
      class="event-featured-image absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full object-cover" />
  </div>

  <!-- Overlay Icon (top-left) -->
  <div class="absolute top-0 left-0 w-16 h-16 sm:w-20 sm:h-20 md:w-[90px] md:h-[90px] z-10 pointer-events-none">
    <div class="absolute top-[-1px] left-[-1px] z-0 w-[115%] h-[115%] aspect-square rounded-br-[38px] sm:rounded-br-[48px] md:rounded-br-[58px] bg-primary-white"></div>
    <div
      class="relative w-full h-full bg-secondary-blue-light group-hover:bg-primary-yellow rounded-[38px] sm:rounded-[48px] md:rounded-[54px] flex items-center justify-center shadow-md">
      <img src="{{overlayIcon}}" alt="" class="w-10 h-10 sm:w-12 sm:h-12 md:w-[60px] md:h-[60px] text-primary-dark-blue group-hover:text-primary-white " />
    </div>
  </div>

  <!-- Navigation Buttons (bottom-right) - Controls carousel below -->
  <div class="absolute bottom-0 right-0 flex gap-3 sm:gap-4 md:gap-5 z-10">
    <div></div>
    <div class="absolute bottom-[-1px] right-[-1px] w-[110%] h-[50px] sm:h-[55px] md:h-[60px] bg-primary-white rounded-tl-[24px] sm:rounded-tl-[28px] md:rounded-tl-[30px]"></div>
    <!-- Previous Button -->
    <button
      class="{{prevClass}} relative flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 md:w-[50px] md:h-[50px] p-2 sm:p-2.5 md:p-[10px] bg-white border border-stroke rounded-full hover:bg-secondary-blue-light hover:border-secondary-blue active:scale-95 transition-all duration-300"
      aria-label="Previous">
      <img src="/assets/svgs/icon-chevron-left.svg" alt=""
        class="w-6 h-6 sm:w-7 sm:h-7 md:w-[30px] md:h-[30px] transition-all duration-300" />
    </button>

    <!-- Next Button -->
    <button
      class="{{nextClass}} relative flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 md:w-[50px] md:h-[50px] p-2 sm:p-2.5 md:p-[10px] bg-white border border-stroke rounded-full hover:bg-secondary-blue-light hover:border-secondary-blue active:scale-95 transition-all duration-300"
      aria-label="Next">
      <img src="/assets/svgs/icon-chevron-right.svg" alt=""
        class="w-6 h-6 sm:w-7 sm:h-7 md:w-[30px] md:h-[30px] transition-all duration-300" />
    </button>
  </div>
</div>
