<!-- Pagination Component - Responsive Design -->
<!-- Usage: data-current-page="3" data-total-pages="5" -->
<div class="flex items-center justify-center gap-2 md:gap-2.5 w-full {{class}}">
  <!-- Previous Button -->
  <button 
    class="pagination-prev flex items-center justify-center gap-1 md:gap-1.5 w-[90px] md:w-[110px] h-9 md:h-10 bg-bgstroke border border-stroke rounded-[5px] font-roboto font-medium text-xs md:text-sm text-gray-700 hover:bg-white hover:border-primary-dark-blue hover:text-primary-dark-blue transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-bgstroke disabled:hover:border-stroke disabled:hover:text-gray-700"
    aria-label="Previous page">
    <img src="/assets/svgs/icon-chevron-left.svg" alt="" class="w-4 h-4 md:w-5 md:h-5" />
    <span>Previous</span>
  </button>

  <!-- Page Numbers -->
  <div class="flex items-center gap-1.5 md:gap-2">
    <!-- Page 1 -->
    <button 
      class="pagination-number flex items-center justify-center w-9 h-9 md:w-10 md:h-10 bg-white border border-stroke rounded-[5px] font-roboto font-medium text-sm md:text-base text-gray-700 hover:border-primary-dark-blue hover:text-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 data-[active]:bg-primary-dark-blue data-[active]:text-primary-white data-[active]:border-primary-dark-blue"
      data-page="1"
      aria-label="Go to page 1">
      1
    </button>

    <!-- Page 2 -->
    <button 
      class="pagination-number flex items-center justify-center w-9 h-9 md:w-10 md:h-10 bg-white border border-stroke rounded-[5px] font-roboto font-medium text-sm md:text-base text-gray-700 hover:border-primary-dark-blue hover:text-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 data-[active]:bg-primary-dark-blue data-[active]:text-primary-white data-[active]:border-primary-dark-blue"
      data-page="2"
      aria-label="Go to page 2">
      2
    </button>

    <!-- Page 3 (Active) -->
    <button 
      class="pagination-number flex items-center justify-center w-9 h-9 md:w-10 md:h-10 bg-primary-dark-blue text-primary-white rounded-[5px] font-roboto font-medium text-sm md:text-base border border-primary-dark-blue hover:bg-primary-dark-blue/90 transition-all duration-300"
      data-page="3"
      data-active="true"
      aria-label="Page 3"
      aria-current="page">
      3
    </button>

    <!-- Page 4 -->
    <button 
      class="pagination-number flex items-center justify-center w-9 h-9 md:w-10 md:h-10 bg-white border border-stroke rounded-[5px] font-roboto font-medium text-sm md:text-base text-gray-700 hover:border-primary-dark-blue hover:text-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 data-[active]:bg-primary-dark-blue data-[active]:text-primary-white data-[active]:border-primary-dark-blue"
      data-page="4"
      aria-label="Go to page 4">
      4
    </button>

    <!-- Page 5 -->
    <button 
      class="pagination-number flex items-center justify-center w-9 h-9 md:w-10 md:h-10 bg-white border border-stroke rounded-[5px] font-roboto font-medium text-sm md:text-base text-gray-700 hover:border-primary-dark-blue hover:text-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 data-[active]:bg-primary-dark-blue data-[active]:text-primary-white data-[active]:border-primary-dark-blue"
      data-page="5"
      aria-label="Go to page 5">
      5
    </button>
  </div>

  <!-- Next Button -->
  <button 
    class="pagination-next flex items-center justify-center gap-1 md:gap-1.5 w-[90px] md:w-[110px] h-9 md:h-10 bg-bgstroke border border-stroke rounded-[5px] font-roboto font-medium text-xs md:text-sm text-gray-700 hover:bg-white hover:border-primary-dark-blue hover:text-primary-dark-blue transition-all duration-300 group disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-bgstroke disabled:hover:border-stroke disabled:hover:text-gray-700"
    aria-label="Next page">
    <span>Next</span>
    <img src="/assets/svgs/icon-chevron-right.svg" alt="" class="w-4 h-4 md:w-5 md:h-5 group-hover:translate-x-0.5 transition-transform" />
  </button>
</div>
