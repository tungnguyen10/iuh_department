<!-- Article Actions Bar Component -->
<!-- Date badge + Share/Copy link buttons -->
<div class="flex items-start justify-between flex-wrap gap-2 sm:gap-2.5 {{class}}">
  <!-- Date Badge -->
  <div class="inline-flex items-center gap-1.5 bg-danger-light rounded-[5px] px-1.5 py-[3px]">
    <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="w-5 h-5 text-danger" />
    <span class="font-roboto font-medium text-sm text-danger">{{date}}</span>
  </div>

  <!-- Action Buttons -->
  <div class="flex items-center gap-2 sm:gap-2.5">
    <!-- Share Button -->
    <button type="button" class="js-share-btn group inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-light hover:bg-primary-dark-blue rounded-[5px] transition-all duration-300 hover:scale-105 hover:shadow-md active:scale-95 active:animate-jelly">
      <img src="/assets/svgs/icon-share.svg" alt="" class="w-5 h-5 shrink-0 text-gray-700 group-hover:text-white transition-all duration-300 group-hover:scale-110 group-active:rotate-12" />
      <span class="font-roboto font-medium text-sm text-gray-700 group-hover:text-white transition-colors duration-300">Share</span>
    </button>

    <!-- Copy Link Button -->
    <button type="button" class="js-copy-link-btn group inline-flex items-center gap-1.5 px-3 py-1.5 bg-gray-light hover:bg-primary-yellow rounded-[5px] transition-all duration-300 hover:scale-105 hover:shadow-md active:scale-95 active:animate-jelly">
      <img src="/assets/svgs/icon-copy.svg" alt="" class="w-5 h-5 shrink-0 text-gray-700 group-hover:text-primary-dark-blue transition-all duration-300 group-hover:scale-110 group-active:-rotate-12" />
      <span class="font-roboto font-medium text-sm text-gray-700 group-hover:text-primary-dark-blue transition-colors duration-300">Copy link</span>
    </button>
  </div>
</div>
