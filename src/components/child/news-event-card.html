<!-- News/Event Card Component - Horizontal Layout -->
<!-- Large card with image and content side by side -->
<article class="group relative bg-white rounded-[5px] shadow-[1px_1px_10px_0_rgba(0,0,0,0.1)] p-2.5 w-full hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-shadow duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="{{link}}" class="absolute inset-0 z-30 rounded-[5px]" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <!-- Content Container -->
  <div class="flex gap-2.5 h-full">
    <!-- Image -->
    <div class="relative shrink-0 w-[280px] h-[170px] rounded-[5px] overflow-hidden">
      <img src="{{image}}" alt="{{imageAlt}}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
    </div>

    <!-- Text Content -->
    <div class="flex-1 flex flex-col justify-between py-1.5 min-w-0">
      <!-- Top Section: Title + Description -->
      <div class="flex flex-col gap-2.5">
        <!-- Title -->
        <h3 class="font-roboto font-medium text-lg leading-normal text-gray-900 line-clamp-2 group-hover:text-primary-dark-blue transition-colors duration-200">
          {{title}}
        </h3>

        <!-- Description -->
        <p class="font-roboto font-normal text-base leading-normal text-gray-700 line-clamp-2">
          {{description}}
        </p>
      </div>

      <!-- Bottom Section: Divider + Date + Link -->
      <div class="flex flex-col gap-2.5">
        <!-- Divider Line -->
        <div class="w-full h-px bg-stroke"></div>

        <!-- Date Badge + "Xem thêm" Link -->
        <div class="flex items-center justify-between">
          <!-- Date Badge -->
          <div class="inline-flex items-center gap-1.5 px-1.5 py-0.5 bg-white border border-danger rounded-[5px]">
            <img src="/assets/svgs/icon-calendar-check.svg" alt="" class="w-5 h-5 shrink-0" />
            <span class="font-roboto font-medium text-sm leading-normal text-danger">{{date}}</span>
          </div>

          <!-- "Xem thêm" Link -->
          <span class="font-roboto font-medium text-base leading-normal text-gray-600 group-hover:text-primary-dark-blue transition-colors duration-200">
            Xem thêm
          </span>
        </div>
      </div>
    </div>
  </div>
</article>
