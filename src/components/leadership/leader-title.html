<!-- Leader Title Component - Section header with icon -->
<div class="relative bg-secondary-blue-light flex items-center justify-center px-6 sm:px-12 md:px-16 py-4 rounded-3xl shadow-[inset_2px_2px_10px_0px_rgba(142,216,248,0.3)] {{class}}">
    <!-- Icon Left (Absolute) -->
    <div class="absolute left-6 sm:left-12 md:left-16 flex items-center w-6 sm:w-7 md:w-8">
        <img src="/assets/svgs/loading.svg" alt="" class="w-full h-auto" />
    </div>
    
    <!-- Title Text (Centered) -->
    <h2 class="font-inter font-bold text-lg sm:text-xl md:text-2xl text-primary-dark-blue text-center leading-normal">
        {{title}}
    </h2>
</div>
