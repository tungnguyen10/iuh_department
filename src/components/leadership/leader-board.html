<article
  data-leader-board-item
  class="group relative rounded-2xl overflow-hidden "
>
  <!-- Mesh Gradient Background -->
  <div class="absolute inset-0 z-0 bg-primary-dark-blue overflow-hidden">
    <div class="absolute top-0 -left-20 w-72 h-72 bg-primary-yellow/30 rounded-full mix-blend-multiply filter blur-3xl animate-pulse"></div>
    <div class="absolute top-20 right-10 w-96 h-96 bg-blue-400/20 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-2000"></div>
    <div class="absolute -bottom-10 left-1/3 w-80 h-80 bg-primary-yellow/20 rounded-full mix-blend-multiply filter blur-3xl animate-pulse animation-delay-4000"></div>
  </div>

  <!-- Glassmorphism Content -->
  <div class="relative z-10 h-full p-6 md:p-8 flex flex-col backdrop-blur-md bg-white/10 border border-white/20 group-hover:border-primary-yellow/50 group-hover:bg-white/15 transition-all duration-500">
    <!-- Header with Avatar Circle -->
    <div class="flex items-start gap-4 mb-6">
      <div class="relative flex-shrink-0 group-hover:scale-110 transition-transform duration-500">
        <div class="w-20 h-20 md:w-24 md:h-24 rounded-full overflow-hidden ring-4 ring-white/30 group-hover:ring-primary-yellow/50 transition-all duration-500 backdrop-blur-sm">
          <img
            src="{{image}}"
            alt="{{name}}"
            class="w-full h-full object-cover"
          />
        </div>
        <div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-primary-yellow flex items-center justify-center shadow-lg shadow-primary-yellow/30 group-hover:shadow-primary-yellow/60 transition-all duration-500">
          <span class="text-xs font-bold text-primary-dark-blue">★</span>
        </div>
      </div>
      
      <div class="flex-1 min-w-0">
        <h3 class="font-bold text-2xl md:text-3xl text-white mb-2 drop-shadow-lg">
          {{name}}
        </h3>
        <div class="flex flex-wrap items-center gap-2 mb-2">
          <span
            class="inline-flex items-center px-3 py-1.5 rounded-full text-xs font-bold bg-primary-yellow text-primary-dark-blue shadow-lg"
          >
            Trưởng Khoa
          </span>
        </div>
        <a
          href="mailto:{{email}}"
          class="inline-flex items-center gap-1.5 text-sm text-white/90 hover:text-primary-yellow transition-colors "
        >
          <img
            src="/assets/svgs/icon-mail-outline.svg"
            alt="Email"
            class="w-4 h-4 brightness-0 invert"
          />
          <span class="drop-shadow">{{email}}</span>
        </a>
      </div>
    </div>

    <!-- Glass Card for Responsibilities -->
    <div class="flex-1 rounded-xl bg-white/20 backdrop-blur-lg border border-white/30 p-5 overflow-hidden flex flex-col shadow-2xl">
      <h4 class="text-sm font-bold text-white/90 uppercase tracking-wider mb-4 drop-shadow">
        Nhiệm vụ và Trách nhiệm
      </h4>
      
      <div class="space-y-3 overflow-y-auto pr-2 scrollbar-thin scrollbar-thumb-white/30 scrollbar-track-transparent">
        <div class="flex items-start gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-6 h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-xs font-bold shadow-lg"
          >
            1
          </span>
          <p class="text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility1}}
          </p>
        </div>

        <div class="flex items-start gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-6 h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-xs font-bold shadow-lg"
          >
            2
          </span>
          <p class="text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility2}}
          </p>
        </div>

        <div class="flex items-start gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-6 h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-xs font-bold shadow-lg"
          >
            3
          </span>
          <p class="text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility3}}
          </p>
        </div>

        <div class="flex items-start gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-6 h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-xs font-bold shadow-lg"
          >
            4
          </span>
          <p class="text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility4}}
          </p>
        </div>
      </div>
    </div>
  </div>
</article>
