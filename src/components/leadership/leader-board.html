<article
  class="group relative rounded-2xl overflow-hidden cursor-pointer"
>
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="leadership-detail.html" class="absolute inset-0 z-50 rounded-2xl" aria-label="{{name}}">
    <span class="sr-only">{{name}}</span>
  </a>

  <!-- Background -->
  <div class="absolute inset-0 z-0 bg-gradient-to-br from-primary-dark-blue via-blue-900 to-primary-dark-blue"></div>

  <!-- Glassmorphism Content -->
  <div class="relative z-10 h-full p-4 flex flex-col backdrop-blur-md bg-white/10 border border-white/20 group-hover:border-primary-yellow/50 group-hover:bg-white/15 transition-all duration-500">
    <!-- Header with Avatar Circle -->
    <div class="flex items-start gap-3 md:gap-4 mb-4 md:mb-6">
      <div class="relative flex-shrink-0 group-hover:scale-110 transition-transform duration-500">
        <div data-photo-src="{{image}}" 
          class="avatar-teacher w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-primary-white ring-4 ring-white/30 group-hover:ring-primary-yellow/50 transition-all duration-500 backdrop-blur-sm overflow-hidden">
        </div>
        <div class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-primary-yellow flex items-center justify-center shadow-lg shadow-primary-yellow/30 group-hover:shadow-primary-yellow/60 transition-all duration-500">
          <span class="text-xs font-bold text-primary-dark-blue">★</span>
        </div>
      </div>
      
      <div class="flex-1 min-w-0">
        <h3 class="font-inter font-semibold text-lg md:text-2xl  text-white mb-1.5 md:mb-2 drop-shadow-lg group-hover:text-primary-yellow transition-colors duration-300" data-leader-name>
          {{name}}
        </h3>
        <div class="flex flex-wrap items-center gap-1.5 md:gap-2 mb-1.5 md:mb-2">
          <span
            class="inline-flex items-center px-2 md:px-3 py-1 md:py-1.5 rounded-full text-xs font-bold bg-primary-yellow text-primary-dark-blue shadow-lg"
          >
            {{position}}
          </span>
        </div>
        <a
          href="mailto:{{email}}"
          class="inline-flex items-center gap-1 md:gap-1.5 text-xs md:text-sm text-white/90 hover:text-primary-yellow transition-colors "
        >
          <img
            src="/assets/svgs/icon-mail-outline.svg"
            alt="Email"
            class="w-3.5 h-3.5 md:w-4 md:h-4 brightness-0 invert"
          />
          <span class="drop-shadow">{{email}}</span>
        </a>
      </div>
    </div>

    <!-- Glass Card for Responsibilities -->
    <div class="flex-1 rounded-lg md:rounded-xl bg-white/20 backdrop-blur-lg border border-white/30 p-3 md:p-4 lg:p-5 overflow-hidden flex flex-col shadow-2xl">
      <h4 class="text-xs md:text-sm font-bold text-white/90 uppercase tracking-wider mb-3 md:mb-4 drop-shadow">
        Nhiệm vụ và Trách nhiệm
      </h4>
      
      <div class="space-y-2 md:space-y-3 overflow-y-auto pr-1 md:pr-2 scrollbar-thin scrollbar-thumb-white/30 scrollbar-track-transparent">
        <div class="flex items-start gap-2 md:gap-3 p-2 md:p-3 rounded-md md:rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-5 h-5 md:w-6 md:h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-[10px] md:text-xs font-bold shadow-lg"
          >
            1
          </span>
          <p class="text-xs md:text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility1}}
          </p>
        </div>

        <div class="flex items-start gap-2 md:gap-3 p-2 md:p-3 rounded-md md:rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-5 h-5 md:w-6 md:h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-[10px] md:text-xs font-bold shadow-lg"
          >
            2
          </span>
          <p class="text-xs md:text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility2}}
          </p>
        </div>

        <div class="flex items-start gap-2 md:gap-3 p-2 md:p-3 rounded-md md:rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-5 h-5 md:w-6 md:h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-[10px] md:text-xs font-bold shadow-lg"
          >
            3
          </span>
          <p class="text-xs md:text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility3}}
          </p>
        </div>

        <div class="flex items-start gap-2 md:gap-3 p-2 md:p-3 rounded-md md:rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 hover:bg-white/20 transition-all">
          <span
            class="flex-shrink-0 w-5 h-5 md:w-6 md:h-6 rounded-full bg-primary-yellow text-primary-dark-blue flex items-center justify-center text-[10px] md:text-xs font-bold shadow-lg"
          >
            4
          </span>
          <p class="text-xs md:text-sm text-white leading-relaxed line-clamp-3 drop-shadow">
            {{responsibility4}}
          </p>
        </div>
      </div>
    </div>
  </div>
</article>
