<article class="group relative rounded-2xl overflow-hidden cursor-pointer h-full">
    <!-- Absolute Link Overlay for Full Card Clickability -->
    <a href="{{link}}" class="absolute inset-0 z-50 rounded-2xl" aria-label="{{name}}">
        <span class="sr-only">{{name}}</span>
    </a>
    <!-- Background -->
    <div class="absolute inset-0 z-0 bg-gradient-to-br from-secondary-blue-light via-secondary-blue/20 to-secondary-blue/40 rounded-2xl"></div>
    <div
        class="relative rounded-2xl z-10 h-full p-4 flex flex-wrap items-start gap-3 backdrop-blur-md bg-secondary-blue-light/95 border border-secondary-blue/30 group-hover:border-primary-yellow group-hover:bg-secondary-blue-light group-hover:shadow-xl group-hover:shadow-secondary-blue/30 transition-all duration-500">
        <!-- Header with Avatar Circle -->
        <div class="relative flex-shrink-0 group-hover:scale-110 transition-transform duration-500">
            <div data-photo-src="{{image}}"
                class="avatar-teacher w-20 h-20 md:w-24 md:h-24 rounded-full flex items-center justify-center text-primary-white ring-4 ring-secondary-blue/40 group-hover:ring-primary-yellow transition-all duration-500 backdrop-blur-sm overflow-hidden">
            </div>
            <div
                class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-primary-yellow flex items-center justify-center shadow-lg shadow-primary-yellow/30 group-hover:shadow-primary-yellow/60 transition-all duration-500">
                <span class="text-xs font-bold text-primary-dark-blue">★</span>
            </div>
        </div>

        <div class="flex-1 min-w-0">
            <h3 class="font-inter font-semibold text-lg md:text-2xl text-primary-dark-blue mb-1.5 md:mb-2 drop-shadow-sm group-hover:text-primary-yellow transition-colors duration-300"
                data-leader-name>
                {{name}}
            </h3>
            <div class="flex flex-wrap items-center gap-1.5 md:gap-2 mb-1.5 md:mb-2">
                <span
                    class="inline-flex items-center px-2 md:px-3 py-1 md:py-1.5 rounded-full text-xs font-bold bg-primary-yellow text-primary-dark-blue shadow-lg">
                    {{position}}
                </span>
            </div>
            <a href="mailto:{{email}}"
                class="inline-flex items-center gap-1 md:gap-1.5 text-xs md:text-sm text-primary-dark-blue/80 hover:text-primary-yellow transition-colors ">
                <img src="/assets/svgs/icon-mail-outline.svg" alt="Email"
                    class="w-3.5 h-3.5 md:w-4 md:h-4" />
                <span class="drop-shadow-sm">{{email}}</span>
            </a>
        </div>

    </div>
</article>
