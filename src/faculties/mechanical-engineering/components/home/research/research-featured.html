<!-- Research Featured Card Component -->
<article class="group relative bg-primary-white border border-stroke hover:border-secondary-blue rounded-xl overflow-hidden w-full h-full lg:h-[460px] flex flex-col p-2 md:p-2.5 pb-3 md:pb-4 hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay for Full Card Clickability -->
  <a href="{{link}}" class="absolute inset-0 z-20" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <!-- Image -->
  <div class="block relative w-full aspect-[560/280] rounded-[5px] overflow-hidden mb-3 md:mb-4">
    <img src="{{image}}" alt="{{imageAlt}}" class="w-full h-full object-cover group-hover:scale-110 group-hover:brightness-95 transition-all duration-500" />
  </div>

  <!-- Content -->
  <div class="flex flex-col flex-1 justify-between w-full">
    <!-- Title and Description -->
    <div class="flex flex-col gap-3 md:gap-4 mb-3 md:mb-4">
      <!-- Title -->
      <h3 class="font-roboto font-medium text-lg md:text-xl leading-normal text-title group-hover:text-primary-dark-blue overflow-hidden line-clamp-2 transition-colors duration-300">
        {{title}}
      </h3>

      <!-- Description -->
      <p class="font-roboto font-normal text-sm md:text-base leading-normal text-gray overflow-hidden line-clamp-3">
        {{description}}
      </p>
    </div>

    <!-- Bottom section -->
    <div class="flex flex-col-reverse sm:flex-row sm:items-center sm:justify-between gap-3 md:gap-6">
      <!-- CTA Button -->
      <div data-include="@shared/components/button/button.html" data-variant="4" data-url="{{link}}" data-text="Xem tất cả" data-class=""></div>

      <!-- Meta -->
      <div class="flex items-center gap-5 text-sm md:text-base">
        <!-- Category -->
        <div class="inline-flex items-center gap-1 md:gap-1.5 text-black group-hover:text-danger transition-colors duration-300">
          <img src="/assets/svgs/icon-education.svg" alt="" class="w-5 h-5 md:w-6 md:h-6 shrink-0 group-hover:brightness-50 group-hover:saturate-150 transition-all duration-300" />
          <span class="font-roboto font-medium leading-normal">{{category}}</span>
        </div>

        <!-- Divider -->
        <div class="h-5 md:h-6 w-0 border-l border-black group-hover:border-danger transition-colors duration-300"></div>

        <!-- Date -->
        <span class="font-roboto font-medium leading-normal text-black group-hover:text-danger transition-colors duration-300">{{date}}</span>
      </div>
    </div>
  </div>
</article>
