<section data-module="intro" class="w-full bg-primary-white py-10 md:py-14 lg:py-16 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-1 items-center gap-6 lg:grid-cols-12 lg:items-stretch lg:gap-8">
      <div class="lg:col-span-5">
        <div class="group relative h-64 overflow-hidden rounded-lg bg-secondary-blue-light shadow-[1px_1px_14px_0_rgba(0,0,0,0.12)] ring-1 ring-primary-dark-blue/10 transition-all duration-500 hover:-translate-y-1 hover:shadow-[0_18px_36px_rgba(21,56,152,0.18)] md:h-80 lg:h-full">
          <img src="/assets/images/dormitory-campus.jpg" alt="Phòng Quản lý Ký túc xá IUH" class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105" />
          <div class="pointer-events-none absolute inset-0 bg-gradient-to-t from-primary-dark-blue/35 via-transparent to-primary-white/10 opacity-80 transition-opacity duration-500 group-hover:opacity-95"></div>
          <div class="pointer-events-none absolute left-4 top-4 flex h-12 w-12 items-center justify-center rounded-lg border border-primary-white/70 bg-primary-white/20 backdrop-blur-sm transition-transform duration-500 group-hover:scale-110">
            <img src="/assets/svgs/logo.svg" alt="" class="h-7 w-7 text-white" />
          </div>
          <div class="pointer-events-none absolute bottom-4 left-4 rounded-lg bg-primary-white/90 px-4 py-3 shadow-[0_10px_24px_rgba(0,0,0,0.14)] backdrop-blur-sm">
            <p class="font-inter text-xs font-semibold uppercase text-primary-dark-blue">Ký túc xá IUH</p>
            <p class="mt-1 font-roboto text-sm font-medium text-title">Không gian sống và học tập</p>
          </div>
          <div data-include="@shared/components/common/core-deco.html" data-class="absolute -bottom-10 -right-10 w-24 opacity-80 transition-transform duration-700 group-hover:scale-110"></div>
        </div>
      </div>

      <div class="flex flex-col justify-center lg:col-span-7">
        <div data-include="@shared/components/common/section-title.html"
          data-subtitle="Phòng Quản lý Ký túc xá IUH"
          data-title="Đồng hành cùng sinh viên trong từng ngày sống nội trú"
          data-description="Phòng Quản lý Ký túc xá là đầu mối hỗ trợ sinh viên về chỗ ở, nội quy sinh hoạt, an ninh, bảo trì và các nhu cầu đời sống trong khu ký túc xá. Mục tiêu là giúp sinh viên có môi trường ở ổn định, thuận tiện và kết nối với cộng đồng IUH."
          data-class="max-w-3xl"
          data-subtitle-class="py-1.5 md:py-2.5 text-primary-dark-blue"
          data-title-class="text-title"
          data-description-class="mt-4 text-gray-700">
        </div>

        <div class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2">
          <article class="group flex gap-3 rounded-lg border border-secondary-blue bg-secondary-blue-light p-4 transition-all duration-500 hover:-translate-y-1 hover:border-primary-dark-blue hover:bg-primary-dark-blue hover:shadow-[4px_8px_30px_0_rgba(21,56,152,0.20)]">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary-white transition-transform duration-500 group-hover:scale-110">
              <img src="/assets/svgs/icon-building.svg" alt="" class="h-5 w-5 text-primary-dark-blue" />
            </div>
            <div>
              <h3 class="font-inter text-base font-bold text-title transition-colors duration-500 group-hover:text-primary-white">Hỗ trợ chỗ ở</h3>
              <p class="mt-1 font-roboto text-sm leading-relaxed text-gray-700 transition-colors duration-500 group-hover:text-primary-white/80">Tiếp nhận đăng ký, gia hạn và hướng dẫn sinh viên nội trú.</p>
            </div>
          </article>

          <article class="group flex gap-3 rounded-lg border border-secondary-blue bg-secondary-blue-light p-4 transition-all duration-500 hover:-translate-y-1 hover:border-primary-dark-blue hover:bg-primary-dark-blue hover:shadow-[4px_8px_30px_0_rgba(21,56,152,0.20)]">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-primary-white transition-transform duration-500 group-hover:scale-110">
              <img src="/assets/svgs/icon-shield-check.svg" alt="" class="h-5 w-5 text-primary-dark-blue" />
            </div>
            <div>
              <h3 class="font-inter text-base font-bold text-title transition-colors duration-500 group-hover:text-primary-white">An toàn sinh hoạt</h3>
              <p class="mt-1 font-roboto text-sm leading-relaxed text-gray-700 transition-colors duration-500 group-hover:text-primary-white/80">Phối hợp trực khu, an ninh và hỗ trợ các tình huống cần phản hồi nhanh.</p>
            </div>
          </article>
        </div>

        <div class="mt-6 flex gap-3 flex-row">
          <div data-include="@shared/components/button/button.html"
            data-variant="4"
            data-text="Tìm hiểu thêm"
            data-url="/about.html"
            data-class="w-full sm:w-fit">
          </div>
          <div data-include="@shared/components/button/button.html"
            data-variant="1"
            data-text="Liên hệ hỗ trợ"
            data-url="/contact.html"
            data-icon="/assets/svgs/icon-arrow-up-right.svg"
            data-class="w-full sm:w-fit">
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
