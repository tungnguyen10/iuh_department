<div data-module="carousel" class="hero-carousel bg-secondary-blue {{class}}">
  <div class="swiper hero-swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <img src="/assets/images/dormitory-hero.svg" class="w-full" alt="Phòng Quản lý Ký túc xá IUH" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <img src="/assets/images/dormitory-campus.svg" class="w-full" alt="Không gian sinh hoạt ký túc xá IUH" />
        </div>
      </div>
      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <img src="/assets/images/dormitory-support.svg" class="w-full" alt="Dịch vụ hỗ trợ sinh viên nội trú" />
        </div>
      </div>
    </div>

    <div class="swiper-button-next hero-nav-next"></div>
    <div class="swiper-button-prev hero-nav-prev"></div>
    <div class="swiper-pagination hero-pagination"></div>
  </div>
</div>
