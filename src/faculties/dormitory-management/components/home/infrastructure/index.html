<section data-module="infrastructure" id="infrastructure-section" class="w-full bg-gradient-to-b from-secondary-blue-light to-primary-white py-12 sm:py-16 md:py-20 lg:py-24 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-12 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 md:gap-5">
      <div class="col-span-12 sm:col-span-2 lg:col-span-1 flex flex-col gap-3 sm:gap-4 pr-0 lg:pr-4 py-4 sm:py-5 md:py-6 lg:py-8 lg:col-start-1 lg:row-start-1">
        <h2 class="font-inter text-2xl sm:text-3xl md:text-3xl lg:text-4xl font-bold text-title leading-tight">
          Cơ sở vật chất nội trú
        </h2>
        <p class="font-roboto font-normal text-sm sm:text-base md:text-base lg:text-lg leading-relaxed text-black text-justify">
          Khu ký túc xá tập trung vào không gian ở, khu tiếp nhận, khu sinh hoạt chung, hệ thống an ninh và kênh bảo trì phục vụ đời sống sinh viên IUH.
        </p>
      </div>

      <div data-include="@faculty/components/home/infrastructure/infrastructure-card.html"
        data-image="/assets/images/dormitory-campus.svg"
        data-alt="Khu nhà ở sinh viên"
        data-title="Khu nhà ở sinh viên"
        data-link="contact.html"
        data-class="col-span-4 sm:col-span-1 lg:col-start-2 lg:row-start-1"></div>
      <div data-include="@faculty/components/home/infrastructure/infrastructure-card.html"
        data-image="/assets/images/dormitory-office.svg"
        data-alt="Văn phòng tiếp nhận"
        data-title="Văn phòng tiếp nhận và hướng dẫn"
        data-link="contact.html"
        data-class="col-span-8 sm:col-span-1 lg:col-start-3 lg:row-start-1"></div>
      <div data-include="@faculty/components/home/infrastructure/infrastructure-card.html"
        data-image="/assets/images/dormitory-support.svg"
        data-alt="Khu sinh hoạt chung"
        data-title="Không gian sinh hoạt chung"
        data-link="contact.html"
        data-class="col-span-8 sm:col-span-1 lg:col-start-1 lg:row-start-2"></div>
      <div data-include="@faculty/components/home/infrastructure/infrastructure-card.html"
        data-image="/assets/images/dormitory-security.svg"
        data-alt="An ninh ký túc xá"
        data-title="Điểm trực an ninh"
        data-link="contact.html"
        data-class="col-span-4 sm:col-span-1 lg:col-start-2 lg:row-start-2"></div>
      <div data-include="@faculty/components/home/infrastructure/infrastructure-card.html"
        data-image="/assets/images/dormitory-maintenance.svg"
        data-alt="Bảo trì ký túc xá"
        data-title="Tiếp nhận bảo trì và dịch vụ"
        data-link="contact.html"
        data-class="col-span-12 sm:col-span-2 lg:col-span-1 lg:col-start-3 lg:row-start-2"></div>
    </div>
  </div>
</section>
