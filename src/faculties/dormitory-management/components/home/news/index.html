<section data-module="news" class="w-full py-8 md:py-14 {{class}}">
  <div class="container mx-auto px-4 flex flex-col items-center">
    <div data-include="@shared/components/common/section-title.html"
      data-title="Thông báo Ký túc xá"
      data-description="Cập nhật các mốc thời gian, quy định và dịch vụ liên quan đến sinh viên đang sinh hoạt nội trú."
      data-class="max-w-3xl text-center"
      data-title-class="text-title text-center"
      data-description-class="text-gray-700">
    </div>

    <div class="w-full relative">
      <div class="news-swiper py-4 md:py-6 lg:py-8">
        <div class="swiper-wrapper">
          <div class="swiper-slide">
            <div data-include="@shared/components/news/news-card.html"
              data-image="/assets/images/dormitory-office.svg"
              data-imageAlt="Thông báo đăng ký nội trú"
              data-title="Hướng dẫn đăng ký chỗ ở ký túc xá học kỳ mới"
              data-excerpt="Phòng Quản lý Ký túc xá tiếp nhận hồ sơ đăng ký, gia hạn và điều chỉnh thông tin phòng ở cho sinh viên IUH."
              data-date="12 tháng 6, 2026"
              data-link="contact.html"
              data-class="">
            </div>
          </div>
          <div class="swiper-slide">
            <div data-include="@shared/components/news/news-card.html"
              data-image="/assets/images/dormitory-maintenance.svg"
              data-imageAlt="Bảo trì cơ sở vật chất"
              data-title="Lịch bảo trì hệ thống điện nước tại khu nhà ở"
              data-excerpt="Sinh viên theo dõi lịch bảo trì định kỳ và gửi phản ánh nếu cần hỗ trợ về phòng ở, điện, nước hoặc internet."
              data-date="10 tháng 6, 2026"
              data-link="contact.html"
              data-class="">
            </div>
          </div>
          <div class="swiper-slide">
            <div data-include="@shared/components/news/news-card.html"
              data-image="/assets/images/dormitory-campus.svg"
              data-imageAlt="Sinh hoạt cộng đồng"
              data-title="Tăng cường nội quy sinh hoạt và an ninh khu túc xá"
              data-excerpt="Các khu nhà ở cập nhật hướng dẫn ra vào, tiếp khách, giữ gìn vệ sinh và phòng cháy chữa cháy trong ký túc xá."
              data-date="08 tháng 6, 2026"
              data-link="contact.html"
              data-class="">
            </div>
          </div>
          <div class="swiper-slide">
            <div data-include="@shared/components/news/news-card.html"
              data-image="/assets/images/dormitory-support.svg"
              data-imageAlt="Hỗ trợ sinh viên"
              data-title="Kênh tiếp nhận yêu cầu hỗ trợ sinh viên nội trú"
              data-excerpt="Sinh viên có thể liên hệ văn phòng ký túc xá để được hướng dẫn về thủ tục, dịch vụ và các tình huống cần xử lý khẩn cấp."
              data-date="05 tháng 6, 2026"
              data-link="contact.html"
              data-class="">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-4 md:gap-5 lg:gap-[21px]">
      <button class="news-nav-prev bg-primary-white border border-stroke rounded-full p-2 md:p-2.5 hover:border-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        <img src="/assets/svgs/icon-chevron-left.svg" alt="Previous" class="w-6 h-6 md:w-[30px] md:h-[30px]" />
      </button>
      <button class="news-nav-next bg-primary-white border border-stroke rounded-full p-2 md:p-2.5 hover:border-primary-dark-blue hover:bg-primary-dark-blue/5 transition-all duration-300 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
        <img src="/assets/svgs/icon-chevron-right.svg" alt="Next" class="w-6 h-6 md:w-[30px] md:h-[30px]" />
      </button>
    </div>
  </div>
</section>
