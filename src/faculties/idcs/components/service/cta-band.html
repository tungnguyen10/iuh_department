<section id="{{id}}" class="relative scroll-mt-20 overflow-hidden bg-primary-dark-blue py-12 md:py-20">
  <div data-include="@shared/components/common/core-deco.html" data-class="pointer-events-none absolute -left-16 bottom-0 w-40 opacity-10 md:w-56"></div>
  <div class="container relative mx-auto grid gap-10 px-4 lg:grid-cols-[minmax(0,5fr)_minmax(0,7fr)] lg:items-center lg:gap-14">
    <div class="nttFade">
      <p class="font-roboto text-xs font-bold uppercase tracking-[0.16em] text-primary-yellow sm:text-sm">{{eyebrow}}</p>
      <h2 class="mt-3 font-inter text-2xl font-bold leading-tight text-primary-white sm:text-3xl md:text-[32px]">{{title}}</h2>
      <p class="mt-4 font-roboto text-base leading-7 text-primary-white/75">{{description}}</p>
      <div class="mt-7">
        <div data-include="@shared/components/button/button.html" data-variant="6" data-url="{{buttonUrl}}" data-text="{{buttonText}}" data-icon="/assets/svgs/icon-arrow-up-right.svg"></div>
      </div>
    </div>

    <ol class="nttFade relative grid gap-4 before:absolute before:bottom-10 before:left-[2.875rem] before:top-10 before:w-px before:bg-primary-white/20 before:content-['']">
      <li class="relative flex gap-5 rounded-lg border border-primary-white/15 bg-primary-dark-blue p-6 transition-colors hover:border-primary-yellow/60">
        <span class="relative z-10 flex size-[2.75rem] shrink-0 items-center justify-center rounded-full bg-primary-yellow font-inter text-sm font-bold text-primary-dark-blue">01</span>
        <div><h3 class="font-inter text-lg font-bold text-primary-white">{{step1Title}}</h3><p class="mt-1.5 font-roboto text-sm leading-6 text-primary-white/75">{{step1Text}}</p></div>
      </li>
      <li class="relative flex gap-5 rounded-lg border border-primary-white/15 bg-primary-dark-blue p-6 transition-colors hover:border-primary-yellow/60">
        <span class="relative z-10 flex size-[2.75rem] shrink-0 items-center justify-center rounded-full border-2 border-primary-yellow bg-primary-dark-blue font-inter text-sm font-bold text-primary-yellow">02</span>
        <div><h3 class="font-inter text-lg font-bold text-primary-white">{{step2Title}}</h3><p class="mt-1.5 font-roboto text-sm leading-6 text-primary-white/75">{{step2Text}}</p></div>
      </li>
      <li class="relative flex gap-5 rounded-lg border border-primary-white/15 bg-primary-dark-blue p-6 transition-colors hover:border-primary-yellow/60">
        <span class="relative z-10 flex size-[2.75rem] shrink-0 items-center justify-center rounded-full border-2 border-primary-yellow bg-primary-dark-blue font-inter text-sm font-bold text-primary-yellow">03</span>
        <div><h3 class="font-inter text-lg font-bold text-primary-white">{{step3Title}}</h3><p class="mt-1.5 font-roboto text-sm leading-6 text-primary-white/75">{{step3Text}}</p></div>
      </li>
    </ol>
  </div>
</section>
