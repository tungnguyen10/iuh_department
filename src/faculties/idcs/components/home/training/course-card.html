<!-- option 1: Course card -->
<article class="group flex h-full flex-col border border-stroke bg-primary-white p-6 transition-all duration-300 hover:-translate-y-1 hover:border-primary-dark-blue/30 hover:shadow-[0_14px_34px_rgba(21,56,152,0.1)] motion-reduce:transform-none motion-reduce:transition-none">
  <p class="font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-dark-blue">{{category}}</p>
  <h3 class="mt-3 font-inter text-lg font-bold leading-snug text-title">{{title}}</h3>
  <dl class="mt-5 grid gap-2 font-roboto text-sm leading-6 text-gray-700">
    <div class="flex gap-2"><dt class="w-24 shrink-0 text-gray">Thời lượng</dt><dd class="font-medium text-title">{{duration}}</dd></div>
    <div class="flex gap-2"><dt class="w-24 shrink-0 text-gray">Hình thức</dt><dd class="font-medium text-title">{{format}}</dd></div>
    <div class="flex gap-2"><dt class="w-24 shrink-0 text-gray">Đối tượng</dt><dd class="font-medium text-title">{{audience}}</dd></div>
  </dl>
  <div class="mt-auto pt-6">
    <div data-include="@shared/components/button/button.html" data-variant="12" data-url="{{url}}" data-text="Chi tiết chương trình" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="min-h-11"></div>
  </div>
</article>

<!-- option 2: Featured course banner -->
<article class="grid overflow-hidden border border-stroke bg-primary-white lg:grid-cols-[minmax(0,1fr)_22rem]">
  <div class="p-7 md:p-10">
    <p class="inline-flex items-center gap-2 rounded bg-secondary-yellow-light px-2.5 py-1 font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-dark-blue">{{category}}</p>
    <h3 class="mt-5 font-inter text-2xl font-bold leading-tight text-title md:text-3xl">{{title}}</h3>
    <p class="mt-4 max-w-2xl font-roboto leading-7 text-gray-700">{{description}}</p>
    <dl class="mt-7 grid gap-5 font-roboto text-sm sm:grid-cols-3">
      <div><dt class="text-xs uppercase tracking-[0.12em] text-gray">Thời lượng</dt><dd class="mt-1 font-inter text-base font-bold text-title">{{duration}}</dd></div>
      <div><dt class="text-xs uppercase tracking-[0.12em] text-gray">Hình thức</dt><dd class="mt-1 font-inter text-base font-bold text-title">{{format}}</dd></div>
      <div><dt class="text-xs uppercase tracking-[0.12em] text-gray">Đối tượng</dt><dd class="mt-1 font-inter text-base font-bold text-title">{{audience}}</dd></div>
    </dl>
    <div class="mt-8"><div data-include="@shared/components/button/button.html" data-variant="4" data-url="{{url}}" data-text="Chi tiết chương trình" data-icon="/assets/svgs/icon-arrow-up-right.svg"></div></div>
  </div>
  <img src="{{image}}" alt="{{imageAlt}}" class="h-full min-h-[14rem] w-full object-cover" loading="lazy" decoding="async" />
</article>
