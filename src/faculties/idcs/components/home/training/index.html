<section id="training" class="scroll-mt-20 bg-primary-white py-14 md:py-20 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:items-end">
      <div data-include="@shared/components/common/section-title.html" data-subtitle="Đào tạo &amp; phát triển năng lực" data-title="Kiến thức ứng dụng cho đội ngũ trong kỷ nguyên công nghiệp mới" data-subtitle-class="!font-roboto !text-xs !font-bold !uppercase !tracking-[0.16em] !text-primary-dark-blue" data-title-class="!mt-3 !max-w-xl !text-title" data-description-class="hidden"></div>
      <p class="max-w-xl font-roboto text-base leading-7 text-gray-700 lg:justify-self-end">Các chương trình đào tạo ngắn hạn được xây dựng theo nhu cầu thực tế, kết hợp kiến thức chuyên môn của IUH và kinh nghiệm triển khai trong môi trường doanh nghiệp.</p>
    </div>

    <div class="mt-10">
      <div data-include="@faculty/components/home/training/course-card.html" data-variant="2" data-category="Chương trình tiêu biểu" data-title="Nâng cao năng suất &amp; cải tiến quy trình sản xuất" data-description="Chương trình kết hợp đào tạo tại lớp và thực hành tại hiện trường, giúp đội ngũ doanh nghiệp nhận diện lãng phí, chuẩn hóa thao tác và đo lường hiệu quả sau cải tiến." data-duration="05 buổi" data-format="Tại doanh nghiệp" data-audience="Quản lý &amp; kỹ sư sản xuất" data-url="/contact.html" data-image="/assets/images/idcs-training.jpg" data-image-alt="Chương trình đào tạo ngắn hạn tại IUH"></div>
    </div>

    <div class="mt-6 grid gap-6 md:grid-cols-3">
      <div data-include="@faculty/components/home/training/course-card.html" data-category="Quản lý chất lượng" data-title="Kiểm soát chất lượng trong sản xuất" data-duration="03 buổi" data-format="Tại IUH" data-audience="Nhân sự QA/QC" data-url="/contact.html"></div>
      <div data-include="@faculty/components/home/training/course-card.html" data-category="Kỹ thuật" data-title="Vận hành và bảo trì thiết bị đo lường" data-duration="04 buổi" data-format="Kết hợp thực hành" data-audience="Kỹ thuật viên" data-url="/contact.html"></div>
      <div data-include="@faculty/components/home/training/course-card.html" data-category="Công nghệ" data-title="Ứng dụng công nghệ số trong quản lý sản xuất" data-duration="03 buổi" data-format="Tại doanh nghiệp" data-audience="Quản lý vận hành" data-url="/contact.html"></div>
    </div>

    <div class="mt-8">
      <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/contact.html" data-text="Xem tất cả chương trình đào tạo" data-icon="/assets/svgs/icon-arrow-up-right.svg"></div>
    </div>
  </div>
</section>
