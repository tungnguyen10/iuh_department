<section id="training" class="scroll-mt-20 border-t-4 border-primary-yellow bg-secondary-yellow-light py-14 md:py-20 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:items-end">
      <div data-include="@shared/components/common/section-title.html" data-subtitle="Đào tạo &amp; phát triển năng lực" data-title="Khóa ngắn hạn cho kỹ sư, quản lý và doanh nghiệp" data-subtitle-class="!font-roboto !text-xs !font-bold !uppercase !tracking-[0.16em] !text-primary-dark-blue" data-title-class="!mt-3 !max-w-xl !text-title" data-description-class="hidden"></div>
      <p class="max-w-xl font-roboto text-base leading-7 text-gray-700 lg:justify-self-end">Chương trình xây dựng trên bài toán thực tế của doanh nghiệp, kết hợp chuyên môn IUH với thực hành tại hiện trường sản xuất.</p>
    </div>

    <div class="mt-10 grid gap-6 lg:grid-cols-[minmax(0,7fr)_minmax(0,5fr)] lg:gap-8">
      <div data-include="@faculty/components/home/training/course-card.html" data-variant="3" data-category="Khóa trọng tâm" data-audience="quản lý &amp; kỹ sư sản xuất" data-title="Nâng cao năng suất &amp; cải tiến quy trình sản xuất" data-description="Nhận diện lãng phí, chuẩn hóa thao tác và theo dõi hiệu quả sau cải tiến ngay trên dây chuyền của doanh nghiệp." data-point1="Nhận diện lãng phí" data-point2="Chuẩn hóa thao tác" data-point3="Đo hiệu quả sau cải tiến" data-sessions="5" data-duration="05 buổi" data-format="Tại doanh nghiệp" data-image="/assets/images/idc-news-samsung.jpg" data-image-alt="Công nhân thao tác trên dây chuyền lắp ráp điện tử tại nhà máy"></div>

      <div class="flex flex-col divide-y divide-stroke overflow-hidden rounded-lg border border-stroke bg-primary-white">
        <div data-include="@faculty/components/home/training/course-card.html" data-variant="4" data-audience="Nhân sự QA/QC" data-title="Kiểm soát chất lượng trong sản xuất" data-description="Thiết lập điểm kiểm soát, phân tích lỗi và xử lý sai lệch trên chuyền." data-sessions="3" data-duration="03 buổi" data-format="Tại IUH" data-url="/training.html#programs"></div>
        <div data-include="@faculty/components/home/training/course-card.html" data-variant="4" data-audience="Kỹ thuật viên" data-title="Vận hành và bảo trì thiết bị đo lường" data-description="Sử dụng đúng quy trình, hiệu chuẩn định kỳ và bảo dưỡng thiết bị đo." data-sessions="4" data-duration="04 buổi" data-format="Kết hợp thực hành" data-url="/training.html#programs"></div>
        <div data-include="@faculty/components/home/training/course-card.html" data-variant="4" data-audience="Quản lý vận hành" data-title="Ứng dụng công nghệ số trong quản lý sản xuất" data-description="Theo dõi sản lượng, dữ liệu vận hành và báo cáo bằng công cụ số." data-sessions="3" data-duration="03 buổi" data-format="Tại doanh nghiệp" data-url="/training.html#programs"></div>
        <div data-include="@faculty/components/home/training/course-card.html" data-variant="4" data-audience="Tổ trưởng sản xuất" data-title="Thực hành 5S và quản lý trực quan tại xưởng" data-description="Sắp xếp khu vực làm việc, chuẩn hóa vị trí và duy trì kỷ luật 5S hằng ngày." data-sessions="2" data-duration="02 buổi" data-format="Tại doanh nghiệp" data-url="/training.html#programs"></div>
      </div>
    </div>

    <div class="mt-8 flex flex-col gap-5 border-t border-primary-yellow/40 pt-6 sm:flex-row sm:items-center sm:justify-between">
      <p class="max-w-2xl font-roboto text-xs leading-5 text-gray">Các chương trình mang tính định hướng. Nội dung, thời lượng và lịch triển khai được thống nhất với doanh nghiệp trước khi tổ chức.</p>
      <div class="shrink-0">
        <div data-include="@shared/components/button/button.html" data-variant="4" data-url="/training.html#programs" data-text="Xem chương trình đào tạo" data-icon="/assets/svgs/icon-arrow-up-right.svg"></div>
      </div>
    </div>
  </div>
</section>
