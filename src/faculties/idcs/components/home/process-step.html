<!-- option 1: Dark timeline step -->
<li class="relative flex-1 border-t-2 border-primary-white/15 pt-5 lg:pt-6">
  <span aria-hidden="true" class="absolute -top-[7px] left-0 block h-3 w-3 rounded-full bg-primary-yellow"></span>
  <p class="font-inter text-xs font-bold tracking-[0.2em] text-primary-yellow">{{index}}</p>
  <h3 class="mt-2 font-inter text-lg font-bold leading-snug text-primary-white">{{title}}</h3>
  <p class="mt-2 font-roboto text-sm leading-6 text-primary-white/70">{{description}}</p>
</li>

<!-- option 2: Light pipeline step -->
<li class="relative border-l-2 border-stroke pb-7 pl-6 last:pb-0">
  <span aria-hidden="true" class="absolute -left-[7px] top-1 block h-3 w-3 rounded-full bg-primary-dark-blue"></span>
  <p class="font-inter text-xs font-bold tracking-[0.2em] text-primary-dark-blue">{{index}}</p>
  <h3 class="mt-1.5 font-inter text-lg font-bold leading-snug text-title">{{title}}</h3>
  <p class="mt-1.5 font-roboto text-sm leading-6 text-gray-700">{{description}}</p>
</li>
