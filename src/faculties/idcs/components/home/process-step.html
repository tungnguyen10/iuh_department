<!-- option 1: Dark chevron step (styled by consulting-process.scss) -->
<li class="iuh-chevron-flow__step">
  <div class="iuh-chevron-flow__head">
    <p class="iuh-chevron-flow__index">{{index}}</p>
    <h3 class="iuh-chevron-flow__title">{{title}}</h3>
  </div>
  <p class="iuh-chevron-flow__text">{{description}}</p>
</li>

<!-- option 2: Light pipeline step -->
<li class="relative border-l-2 border-stroke pb-7 pl-6 last:pb-0">
  <span aria-hidden="true" class="absolute -left-[7px] top-1 block h-3 w-3 rounded-full bg-primary-dark-blue"></span>
  <p class="font-inter text-xs font-bold tracking-[0.2em] text-primary-dark-blue">{{index}}</p>
  <h3 class="mt-1.5 font-inter text-lg font-bold leading-snug text-title">{{title}}</h3>
  <p class="mt-1.5 font-roboto text-sm leading-6 text-gray-700">{{description}}</p>
</li>

<!-- option 3: Handoff rail step (styled by technology-transfer.scss) -->
<li class="iuh-handoff__step">
  <span class="iuh-handoff__node" aria-hidden="true"></span>
  <p class="iuh-handoff__index">{{index}}</p>
  <h3 class="iuh-handoff__title">{{title}}</h3>
  <p class="iuh-handoff__text">{{description}}</p>
</li>
