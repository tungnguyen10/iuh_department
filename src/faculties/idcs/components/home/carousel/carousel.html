<div data-module="carousel" class="hero-carousel bg-primary-dark-blue {{class}}">
  <div class="swiper hero-swiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <!-- Photo: https://iuh.edu.vn/upload/images/baiviet/csvc002.jpg -->
          <img src="/assets/images/idcs-facility.jpg" width="1600" height="1067" class="w-full" alt="Phòng thí nghiệm và xưởng thực hành của IUH" />
        </div>
      </div>

      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <!-- Photo: https://iuh.edu.vn/upload/images/baiviet/2026/08/AIoT1.JPG -->
          <img src="/assets/images/idcs-equipment.jpg" width="1600" height="1066" class="w-full" alt="Thiết bị kỹ thuật phục vụ đo kiểm và đào tạo" loading="lazy" decoding="async" />
        </div>
      </div>

      <div class="swiper-slide">
        <div class="carousel-slide-content">
          <!-- Photo: https://iuh.edu.vn/upload/images/baiviet/2026/09/MOU2.JPG -->
          <img src="/assets/images/idcs-technology-transfer.jpg" width="1600" height="1066" class="w-full" alt="Hợp tác chuyển giao công nghệ giữa IUH và doanh nghiệp" loading="lazy" decoding="async" />
        </div>
      </div>
    </div>

    <div class="swiper-button-next hero-nav-next"></div>
    <div class="swiper-button-prev hero-nav-prev"></div>
    <div class="swiper-pagination hero-pagination"></div>
  </div>
</div>
