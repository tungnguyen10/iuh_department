<section id="updates" class="scroll-mt-20 bg-primary-white py-14 md:py-20 {{class}}">
  <div class="container mx-auto px-4">
    <div data-include="@shared/components/common/section-title.html"
      data-subtitle="Kết nối với doanh nghiệp"
      data-title="Tin tức &amp; thông tin ngành"
      data-description="Tin công nghiệp từ IDC và văn bản chuyên ngành dành cho doanh nghiệp."
      data-subtitle-class="!font-roboto !text-xs !font-bold !uppercase !tracking-[0.16em] !text-primary-dark-blue"
      data-title-class="!mt-3 !text-title"
      data-description-class="!mt-3 !max-w-2xl !text-base !leading-7 !text-gray-700"></div>

    <div class="mt-10 grid min-w-0 gap-10 lg:grid-cols-[minmax(0,7fr)_minmax(0,5fr)] lg:gap-10 xl:gap-14">
      <section aria-labelledby="updates-news-title" class="min-w-0">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-stroke pb-4">
          <h3 id="updates-news-title" class="font-inter text-lg font-bold text-title sm:text-xl">Tin tức &amp; hoạt động</h3>
          <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/news.html" data-text="Xem tất cả" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="!text-sm whitespace-nowrap"></div>
        </div>
        <div data-news-sidebar-items data-limit="3" data-news-layout="editorial" class="mt-6 grid grid-cols-1 gap-x-6 gap-y-6 sm:grid-cols-2"></div>
      </section>

      <section aria-labelledby="updates-documents-title" class="min-w-0">
        <div class="flex flex-wrap items-center justify-between gap-3 border-b border-stroke pb-4">
          <h3 id="updates-documents-title" class="font-inter text-lg font-bold text-title sm:text-xl">Văn bản pháp luật</h3>
          <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/legal-documents.html" data-text="Xem tất cả" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="!text-sm whitespace-nowrap"></div>
        </div>
        <ul class="mt-6 divide-y divide-primary-dark-blue/10 rounded-lg bg-[#F2F6FC] px-5 sm:px-7">
          <div data-include="@shared/components/documents/document-item.html" data-variant="6" data-url="/legal-documents.html#document-01" data-type-label="Thông tư" data-title="Thông tư quy định hoạt động kiểm định, hiệu chuẩn, thử nghiệm phương tiện đo" data-code="12/2026/TT-BKHCN" data-datetime="2026-09-12" data-date="12/09/2026"></div>
          <div data-include="@shared/components/documents/document-item.html" data-variant="6" data-url="/legal-documents.html#document-02" data-type-label="Quyết định" data-title="Quyết định phê duyệt chương trình hỗ trợ chuyển giao công nghệ cho doanh nghiệp" data-code="486/QĐ-BKHCN" data-datetime="2026-07-24" data-date="24/07/2026"></div>
          <div data-include="@shared/components/documents/document-item.html" data-variant="6" data-url="/legal-documents.html#document-03" data-type-label="Nghị định" data-title="Nghị định về chính sách phát triển công nghiệp hỗ trợ" data-code="47/2026/NĐ-CP" data-datetime="2026-05-08" data-date="08/05/2026"></div>
          <div data-include="@shared/components/documents/document-item.html" data-variant="6" data-url="/legal-documents.html#document-04" data-type-label="Thông tư" data-title="Thông tư quy định đào tạo, bồi dưỡng thường xuyên cho người lao động kỹ thuật" data-code="08/2025/TT-BLĐTBXH" data-datetime="2025-11-19" data-date="19/11/2025"></div>
        </ul>
      </section>
    </div>
  </div>
</section>
