<section id="consulting" class="relative scroll-mt-20 overflow-hidden bg-primary-dark-blue py-14 md:py-20 {{class}}">
  <div data-include="@shared/components/common/brand-deco.html" data-variant="5" data-class="pointer-events-none absolute -left-8 top-8 w-28 opacity-10 md:w-36" data-icon-class="[filter:brightness(0)_invert(1)]"></div>
  <div class="container relative mx-auto px-4">
    <div class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_minmax(0,1fr)] lg:items-end">
      <div data-include="@shared/components/common/section-title.html" data-subtitle="Tư vấn doanh nghiệp" data-title="Từ hiện trạng sản xuất đến cải tiến có thể đo lường" data-subtitle-class="!font-roboto !text-xs !font-bold !uppercase !tracking-[0.16em] !text-primary-yellow" data-title-class="!mt-3 !max-w-xl !text-primary-white" data-description-class="hidden"></div>
      <p class="max-w-xl font-roboto text-base leading-7 text-primary-white/75 lg:justify-self-end">IDCS đồng hành cùng doanh nghiệp trong việc đánh giá hiện trạng, xác định điểm nghẽn và xây dựng giải pháp nâng cao chất lượng, năng suất và hiệu quả vận hành.</p>
    </div>

    <ol class="mt-12 grid gap-8 md:grid-cols-2 lg:flex lg:gap-6">
      <div data-include="@faculty/components/home/process-step.html" data-index="01" data-title="Khảo sát hiện trạng" data-description="Ghi nhận quy trình, thiết bị và dữ liệu vận hành thực tế tại doanh nghiệp."></div>
      <div data-include="@faculty/components/home/process-step.html" data-index="02" data-title="Phân tích vấn đề" data-description="Xác định điểm nghẽn, nguyên nhân gốc và mức độ ảnh hưởng tới kết quả."></div>
      <div data-include="@faculty/components/home/process-step.html" data-index="03" data-title="Triển khai cải tiến" data-description="Đề xuất và thực hiện phương án cải tiến tại hiện trường cùng đội ngũ doanh nghiệp."></div>
      <div data-include="@faculty/components/home/process-step.html" data-index="04" data-title="Chuẩn hóa quy trình" data-description="Chuẩn hóa thao tác, tài liệu và quy trình để kết quả cải tiến được duy trì."></div>
      <div data-include="@faculty/components/home/process-step.html" data-index="05" data-title="Đánh giá &amp; nhân rộng" data-description="Đo lường hiệu quả sau cải tiến và nhân rộng sang công đoạn, dây chuyền khác."></div>
    </ol>

    <div class="mt-12 grid gap-6 border-t border-primary-white/15 pt-8 lg:grid-cols-[minmax(0,1fr)_auto] lg:items-center">
      <ul class="flex flex-wrap gap-x-8 gap-y-3 font-roboto text-sm font-semibold uppercase tracking-[0.12em] text-primary-white/70">
        <li>Nâng cao chất lượng</li>
        <li>Tối ưu năng suất</li>
        <li>Cải thiện vận hành</li>
      </ul>
      <div data-include="@shared/components/button/button.html" data-variant="6" data-url="/consulting.html" data-text="Tìm hiểu tư vấn cải tiến" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="lg:justify-self-end"></div>
    </div>
  </div>
</section>
