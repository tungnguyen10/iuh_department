<section data-module="notice-hub" aria-label="Thông tin & tiện ích" class="w-full bg-secondary-blue-light/40 py-10 md:py-14 motion-reduce:!transform-none motion-reduce:!opacity-100 motion-reduce:!transition-none {{class}}">
  <div class="container mx-auto px-4">
    <div class="mb-7 flex flex-col gap-3 md:mb-8 md:flex-row md:items-end md:justify-between md:gap-8">
      <div data-include="@shared/components/common/section-title.html"
        data-title="Thông tin &amp; tiện ích"
        data-class="max-w-2xl"
        data-title-class="leading-tight text-primary-dark-blue">
      </div>
      <p class="max-w-md text-sm leading-6 text-black md:text-base md:text-right">Tra cứu thông báo và lịch đặt phòng họp của Phòng Tổ chức – Hành chính.</p>
    </div>

    <div class="grid min-w-0 grid-cols-1 gap-5 md:grid-cols-2 lg:grid-cols-[minmax(0,9fr)_minmax(0,11fr)] lg:items-stretch lg:gap-7 xl:gap-9">
      <!-- Notices: keep the existing content and dates, with the important notice first. -->
      <section aria-labelledby="notice-list-title" class="flex min-w-0 flex-col rounded-xl border border-primary-dark-blue/10 bg-primary-white p-5 lg:p-6">
        <div class="mb-5 flex items-center gap-3">
          <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-secondary-blue-light">
            <img src="/assets/svgs/icon-notification.svg" alt="" class="h-5 w-5 text-primary-dark-blue" />
          </span>
          <h3 id="notice-list-title" class="font-inter text-lg font-bold text-primary-dark-blue md:text-xl">Thông báo &amp; hạn xử lý</h3>
        </div>
        <ul class="-mx-1 mb-5 flex-1 space-y-1">
          <div data-include="@faculty/components/home/notice-hub/notice-item.html" data-url="/news-detail.html" data-datetime="2025-05-15" data-day="15" data-month-year="05/2025" data-badge="Quan trọng" data-title="Thông báo về việc rà soát, cập nhật thông tin nhân sự năm 2025" data-class="border border-primary-dark-blue/10 bg-secondary-blue-light/50 p-4"></div>
          <div data-include="@faculty/components/home/notice-hub/notice-item.html" data-url="/news-detail.html" data-datetime="2025-05-14" data-day="14" data-month-year="05/2025" data-title="Hướng dẫn đăng ký nghỉ phép trên phần mềm E-Office" data-class="px-4 py-4 hover:bg-secondary-blue-light/40"></div>
          <div data-include="@faculty/components/home/notice-hub/notice-item.html" data-url="/news-detail.html" data-datetime="2025-05-13" data-day="13" data-month-year="05/2025" data-title="Kế hoạch tổ chức Hội nghị điển hình tiên tiến IUH giai đoạn 2020-2025" data-class="px-4 py-4 hover:bg-secondary-blue-light/40"></div>
          <div data-include="@faculty/components/home/notice-hub/notice-item.html" data-url="/news-detail.html" data-datetime="2025-05-12" data-day="12" data-month-year="05/2025" data-title="Thông báo cập nhật quy trình tiếp nhận và xử lý văn bản" data-class="px-4 py-4 hover:bg-secondary-blue-light/40"></div>
          <div data-include="@faculty/components/home/notice-hub/notice-item.html" data-url="/news-detail.html" data-datetime="2025-05-09" data-day="09" data-month-year="05/2025" data-title="Hướng dẫn thực hiện chế độ, chính sách đối với người lao động" data-class="px-4 py-4 hover:bg-secondary-blue-light/40"></div>
        </ul>
        <div class="mt-auto border-t border-stroke pt-4">
          <div data-include="@shared/components/button/button.html" data-variant="12" data-url="/news.html" data-text="Xem tất cả thông báo" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="min-h-11 motion-reduce:transition-none" data-icon-class="motion-reduce:transform-none motion-reduce:transition-none"></div>
        </div>
      </section>

      <div data-include="@shared/components/calendar/weekly-calendar.html" data-title="Lịch đặt phòng họp" data-class="min-w-0"></div>
    </div>
  </div>
</section>
