<section data-module="activities" id="activities-section" class="w-full bg-primary-white py-10 md:py-14 {{class}}">
  <div class="container mx-auto px-4">
    <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between md:gap-8">
      <div data-include="@shared/components/common/section-title.html"
        data-subtitle="Hành chính – hậu cần"
        data-title="Hoạt động &amp; Phong trào"
        data-description="Các hoạt động nội bộ, tập huấn nghiệp vụ và chương trình phối hợp giúp các đơn vị nâng cao năng lực quản trị."
        data-class="max-w-3xl">
      </div>
      <div class="hidden shrink-0 md:block">
        <div data-include="@shared/components/button/button.html"
          data-variant="8"
          data-text="Xem tất cả"
          data-url="/news.html"
          data-icon="/assets/svgs/icon-arrow-up-right.svg">
        </div>
      </div>
    </div>

    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <div data-include="@shared/components/common/event-card.html"
        data-link="/news-detail.html"
        data-title="Chiến dịch Mùa hè xanh 2025"
        data-image="/assets/images/default.jpg"
        data-image-alt="Chiến dịch Mùa hè xanh 2025"
        data-type-icon="/assets/svgs/icon-tag.svg"
        data-type-badge="Nội bộ"
        data-location-icon="/assets/svgs/icon-location-pin.svg"
        data-location-badge="IUH"
        data-date-icon="/assets/svgs/icon-calendar-check.svg"
        data-date-badge="10/05/2025">
      </div>

      <div data-include="@shared/components/common/event-card.html"

        data-image="/assets/images/default.jpg"

        data-type-icon="/assets/svgs/icon-tag.svg"

        data-location-icon="/assets/svgs/icon-location-pin.svg"

        data-type-icon="/assets/svgs/icon-tag.svg"
        data-type-badge="Tập huấn"
        data-location-icon="/assets/svgs/icon-location-pin.svg"
        data-location-badge="IUH"
        data-date-icon="/assets/svgs/icon-calendar-check.svg"
        data-date-badge="02/05/2025">
      </div>

      <div data-include="@shared/components/common/event-card.html"
        data-link="/news-detail.html"

        data-type-badge="Hội nghị"

        data-location-badge="IUH"

      <div data-include="@shared/components/common/event-card.html"
        data-link="/news-detail.html"

        data-type-badge="Hội nghị"

        data-location-badge="IUH"

        data-date-badge="25/04/2025">
      </div>
    </div>

    <div class="mt-6 md:hidden">
      <div data-include="@shared/components/button/button.html"
        data-variant="8"
        data-text="Xem tất cả hoạt động"
        data-url="/news.html"
        data-icon="/assets/svgs/icon-arrow-up-right.svg"
        data-class="w-full justify-center">
      </div>
    </div>
  </div>
