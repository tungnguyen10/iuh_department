<article class="stats-card !cursor-default !will-change-auto group relative min-w-0 min-h-[190px] bg-primary-dark-blue p-4 transition-colors duration-300 hover:bg-[#1C409D] sm:min-h-[210px] sm:p-6 motion-reduce:transition-none" data-count="{{count}}" data-suffix="{{suffix}}">
  <div class="flex items-start justify-between gap-2">
    <p class="font-roboto text-[11px] font-bold uppercase tracking-[0.12em] text-primary-white/75 sm:text-xs">{{category}}</p>
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-primary-white/15 bg-primary-white/10 sm:h-10 sm:w-10">
      <img src="{{icon}}" alt="" class="h-5 w-5 brightness-0 invert" />
    </span>
  </div>

  <div class="mt-7 flex items-baseline font-inter font-bold leading-none tabular-nums sm:mt-9">
    <span class="stats-number text-[34px] tracking-[-0.04em] text-primary-white sm:text-[44px] lg:text-5xl">{{count}}</span>
    <span class="stats-suffix ml-0.5 text-2xl text-primary-yellow sm:text-3xl">{{suffix}}</span>
  </div>

  <p class="mt-3 max-w-[18rem] font-roboto text-sm font-medium leading-snug text-primary-white/85 sm:text-base">{{description}}</p>
</article>
