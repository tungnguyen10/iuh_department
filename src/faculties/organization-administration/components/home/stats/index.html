<!-- Stats and Staff Systems Section -->
<section data-module="stats"
    class="relative w-full bg-[#F4F8FD] py-8 md:py-14 {{class}}">
    <div class="container relative mx-auto px-4">
      <div data-include="@faculty/components/home/staff-services/index.html" data-class=""></div>

      <div class="relative overflow-hidden rounded-3xl bg-primary-dark-blue shadow-[0_20px_48px_-24px_rgba(21,56,152,0.35)]">
        <div aria-hidden="true" class="pointer-events-none absolute inset-y-0 left-0 z-10 w-1.5 bg-primary-yellow"></div>
        <div data-include="@shared/components/common/brand-deco.html" data-variant="2" data-class="absolute -right-12 -top-16 w-52 opacity-[0.06] sm:w-64" data-icon-class="brightness-0 invert"></div>

        <div class="relative flex flex-col gap-3 border-b border-primary-white/15 px-6 py-6 sm:px-8 lg:flex-row lg:items-end lg:justify-between lg:gap-8">
          <div>
            <p class="font-roboto text-xs font-bold uppercase tracking-[0.18em] text-primary-yellow">Thống kê tổng quan</p>
            <h2 class="mt-2 font-inter text-2xl font-bold leading-tight text-primary-white sm:text-3xl">Quy mô và hiệu quả vận hành</h2>
          </div>
          <p class="max-w-xl font-roboto text-sm leading-relaxed text-primary-white/80 sm:text-base lg:text-right">Các chỉ số chính về nhân sự, hồ sơ và phối hợp hành chính.</p>
        </div>

        <div class="relative grid grid-cols-2 gap-px bg-primary-white/15 lg:grid-cols-4">
          <div data-include="@faculty/components/home/stats/stat-item.html" data-count="300" data-suffix="+"
            data-category="Nhân sự" data-icon="/assets/svgs/icon-user.svg"
            data-description="Cán bộ, viên chức đang công tác"></div>

          <div data-include="@faculty/components/home/stats/stat-item.html" data-count="5000" data-suffix="+"
            data-category="Hồ sơ" data-icon="/assets/svgs/icon-agreement.svg"
            data-description="Hồ sơ, biểu mẫu xử lý mỗi năm"></div>

          <div data-include="@faculty/components/home/stats/stat-item.html" data-count="25" data-suffix="+"
            data-category="Phối hợp" data-icon="/assets/svgs/icon-building.svg"
            data-description="Đơn vị, phòng ban phối hợp"></div>

          <div data-include="@faculty/components/home/stats/stat-item.html" data-count="98" data-suffix="%"
            data-category="Tiến độ" data-icon="/assets/svgs/icon-shield-check.svg"
            data-description="Hồ sơ xử lý đúng hạn"></div>
        </div>
      </div>
    </div>
</section>
