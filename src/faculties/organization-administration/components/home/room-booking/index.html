<section id="room-booking" aria-label="Đăng ký và lịch phòng họp" class="relative isolate w-full overflow-hidden bg-[linear-gradient(180deg,#F4F8FD_0%,#FFFFFF_24%,#FFFFFF_78%,#F4F7FD_100%)] py-12 md:py-16 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid min-w-0 grid-cols-1 gap-8 lg:grid-cols-[minmax(0,9fr)_minmax(0,11fr)] lg:items-stretch lg:gap-7 xl:gap-9">
      <div class="relative min-w-0">
        <div aria-hidden="true" class="pointer-events-none absolute -bottom-3 -left-3 h-28 w-36 rounded-bl-3xl border-b-4 border-l-4 border-primary-yellow sm:-bottom-4 sm:-left-4"></div>
        <section aria-labelledby="room-booking-banner-title" class="relative flex h-full min-h-[340px] min-w-0 flex-col justify-end overflow-hidden rounded-2xl bg-primary-dark-blue p-6 sm:p-8 lg:min-h-[480px]">
          <!-- Photo: https://iuh.edu.vn/Resource/Upload2/Image/2023/12/vl-image002.jpg -->
          <img src="/assets/images/room-booking-iuh.jpg" alt="" width="1024" height="682" loading="lazy" decoding="async" class="absolute inset-0 h-full w-full object-cover object-center" />
          <div aria-hidden="true" class="absolute inset-0 bg-gradient-to-b from-primary-dark-blue/15 via-primary-dark-blue/70 to-primary-dark-blue"></div>
          <div class="relative pt-16 lg:pt-24">
            <p class="mb-3 font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-yellow sm:text-sm">Phòng họp IUH</p>
            <h2 id="room-booking-banner-title" class="max-w-md font-inter text-2xl font-bold leading-tight text-primary-white sm:text-3xl lg:text-[32px]">Đăng ký phòng họp<br class="hidden sm:block" /> cho đơn vị của bạn</h2>
            <p class="mt-3 max-w-md font-roboto text-sm leading-6 text-primary-white/90 md:text-base md:leading-7">Tra cứu lịch sử dụng và đăng ký phòng phù hợp với kế hoạch của đơn vị.</p>
            <div class="mt-6">
              <div data-include="@shared/components/button/button.html" data-variant="6" data-url="/room-booking.html" data-text="Đăng ký phòng họp" data-class="min-h-12 !text-primary-dark-blue focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-white focus-visible:ring-offset-2 focus-visible:ring-offset-primary-dark-blue motion-reduce:transition-none" data-icon-class="motion-reduce:transform-none motion-reduce:transition-none"></div>
            </div>
          </div>
        </section>
      </div>

      <div data-include="@shared/components/calendar/weekly-calendar.html" data-title="Lịch đặt phòng họp" data-class="min-w-0"></div>
    </div>
  </div>
</section>
