<section id="room-booking" aria-label="Đăng ký và lịch phòng họp" class="relative isolate w-full overflow-hidden bg-secondary-yellow-light/40 py-12 md:py-16 {{class}}">
  <div data-include="@shared/components/common/brand-deco.html" data-variant="1" data-class="pointer-events-none absolute -right-10 -top-10 w-40 opacity-10 sm:w-52"></div>
  <div class="container relative mx-auto px-4">
    <div class="mb-7 flex flex-col gap-3 md:mb-8 md:flex-row md:items-end md:justify-between md:gap-8">
      <div data-include="@shared/components/common/section-title.html"
        data-title="Lịch đặt phòng họp"
        data-class="max-w-2xl"
        data-title-class="leading-tight text-primary-dark-blue">
      </div>
      <p class="max-w-md text-sm leading-6 text-black md:text-base md:text-right">Theo dõi các phòng họp đã được đăng ký sử dụng.</p>
    </div>

    <div class="grid min-w-0 grid-cols-1 gap-8 lg:grid-cols-2 lg:items-stretch lg:gap-7 xl:gap-9">
      <div data-include="@shared/components/calendar/weekly-calendar.html" data-title="Lịch đặt phòng họp" data-class="min-w-0"></div>

      <div data-include="@faculty/components/home/room-booking/rooms-carousel.html" data-class=""></div>
    </div>
  </div>
</section>
