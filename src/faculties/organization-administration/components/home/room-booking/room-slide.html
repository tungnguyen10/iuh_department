<div class="swiper-slide">
  <article class="relative flex h-full min-h-[320px] flex-col justify-end overflow-hidden bg-primary-dark-blue">
    <img src="{{image}}" alt="{{alt}}" width="1024" height="682" loading="lazy" decoding="async" class="absolute inset-0 h-full w-full object-cover object-center" />
    <div class="relative border-l-[3px] border-primary-yellow bg-primary-dark-blue/95 px-4 py-4 sm:px-5">
      <p class="font-roboto text-xs font-bold uppercase tracking-[0.14em] text-primary-yellow">{{type}}</p>
      <h3 class="mt-1 font-inter text-lg font-bold leading-tight text-primary-white md:text-xl">{{title}}</h3>
      <p class="mt-1.5 text-sm leading-6 text-primary-white/75">{{meta}}</p>
    </div>
  </article>
</div>
