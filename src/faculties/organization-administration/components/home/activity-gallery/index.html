<section data-module="activity-gallery" id="activity-gallery-section" class="w-full bg-gradient-to-b from-secondary-blue-light to-primary-white py-12 sm:py-16 md:py-20 lg:py-24 {{class}}">
  <div class="container mx-auto px-4">
    <div class="grid grid-cols-12 sm:grid-cols-2 lg:grid-cols-3 gap-3 sm:gap-4 md:gap-5">
      <div class="col-span-12 sm:col-span-2 lg:col-span-1 flex flex-col gap-3 sm:gap-4 pr-0 lg:pr-4 py-4 sm:py-5 md:py-6 lg:py-8 lg:col-start-1 lg:row-start-1">
        <h2 class="font-inter text-2xl sm:text-3xl md:text-3xl lg:text-4xl font-bold text-title leading-tight">
          Hình ảnh hoạt động
        </h2>
        <p class="font-roboto font-normal text-sm sm:text-base md:text-base lg:text-lg leading-relaxed text-black text-justify">
          Ghi nhận các hoạt động, chương trình và sự kiện nội bộ do Phòng Tổ chức – Hành chính tổ chức và phối hợp cùng các đơn vị.
        </p>
      </div>

      <div data-include="@faculty/components/home/activity-gallery/gallery-card.html"
        data-image="/assets/images/default.jpg"
        data-alt="Hội nghị cán bộ, viên chức"
        data-title="Hội nghị cán bộ, viên chức"
        data-link="/news.html"
        data-class="col-span-4 sm:col-span-1 lg:col-start-2 lg:row-start-1"></div>
      <div data-include="@faculty/components/home/activity-gallery/gallery-card.html"
        data-image="/assets/images/default.jpg"
        data-alt="Tập huấn nghiệp vụ hành chính"
        data-title="Tập huấn nghiệp vụ hành chính"
        data-link="/news.html"
        data-class="col-span-8 sm:col-span-1 lg:col-start-3 lg:row-start-1"></div>
      <div data-include="@faculty/components/home/activity-gallery/gallery-card.html"
        data-image="/assets/images/default.jpg"
        data-alt="Hoạt động phong trào đoàn thể"
        data-title="Hoạt động phong trào đoàn thể"
        data-link="/news.html"
        data-class="col-span-8 sm:col-span-1 lg:col-start-1 lg:row-start-2"></div>
      <div data-include="@faculty/components/home/activity-gallery/gallery-card.html"
        data-image="/assets/images/default.jpg"
        data-alt="Lễ tuyên dương thi đua khen thưởng"
        data-title="Lễ tuyên dương thi đua khen thưởng"
        data-link="/news.html"
        data-class="col-span-4 sm:col-span-1 lg:col-start-2 lg:row-start-2"></div>
      <div data-include="@faculty/components/home/activity-gallery/gallery-card.html"
        data-image="/assets/images/default.jpg"
        data-alt="Chương trình kết nối đơn vị"
        data-title="Chương trình kết nối đơn vị"
        data-link="/news.html"
        data-class="col-span-12 sm:col-span-2 lg:col-span-1 lg:col-start-3 lg:row-start-2"></div>
    </div>
  </div>
</section>
