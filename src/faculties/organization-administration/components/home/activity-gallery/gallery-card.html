<div class="activity-gallery-card group relative overflow-hidden rounded-lg shadow-md hover:shadow-2xl hover:-translate-y-2 active:scale-95 transition-all duration-500 cursor-pointer touch-manipulation {{class}}">
  <a href="{{link}}" class="absolute inset-0 z-30" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>
  <img src="{{image}}" alt="{{alt}}" class="w-full h-56 sm:h-64 md:h-72 lg:h-80 object-cover rounded-lg" />
  <div class="absolute inset-0 bg-gradient-to-b from-[rgba(21,56,152,0.25)] via-[rgba(21,56,152,0.55)] to-[rgba(21,56,152,0.95)] opacity-0 group-hover:opacity-100 group-active:opacity-100 transition-opacity duration-500 flex flex-col justify-end p-3 sm:p-4 md:p-5 rounded-lg pointer-events-none z-20">
    <div class="flex items-center justify-between w-full gap-2 sm:gap-3">
      <p class="flex-1 font-roboto font-medium text-sm sm:text-base md:text-lg text-primary-white leading-snug sm:leading-normal">
        {{title}}
      </p>
      <div class="flex-shrink-0 w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-secondary-blue-light border border-secondary-blue flex items-center justify-center group-hover:bg-secondary-blue group-hover:border-primary-white transition-all duration-300">
        <img src="/assets/svgs/icon-arrow-up-right.svg" alt="" class="w-5 h-5 sm:w-6 sm:h-6" />
      </div>
    </div>
  </div>
</div>
