<section data-module="staff-services" class="relative w-full overflow-hidden bg-gradient-to-b from-primary-white via-[#F5F8FD] to-[#EDF2FB] py-10 md:py-14 {{class}}">
  <div data-include="@shared/components/common/brand-deco.html" data-variant="2" data-class="absolute -bottom-10 -right-10 w-36 opacity-[0.1] sm:w-44"></div>
  <div class="container relative mx-auto px-4">
    <div class="flex flex-wrap items-end justify-between gap-x-6 gap-y-2">
      <div data-include="@shared/components/common/section-title.html"
        data-title="Tôi cần..."
        data-description="Chọn nhanh dịch vụ hành chính bạn cần thực hiện."
        data-class="max-w-2xl"
        data-title-class="leading-tight text-primary-dark-blue"
        data-description-class="mt-1.5 !text-base !leading-6 !text-black">
      </div>
      <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/documents-forms.html" data-text="Xem tất cả" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="shrink-0 motion-reduce:transition-none" data-icon-class="motion-reduce:transform-none motion-reduce:transition-none"></div>
    </div>

    <div data-services-grid class="mt-6 grid grid-cols-1 gap-3 sm:grid-cols-2 md:grid-cols-3 md:gap-4 lg:grid-cols-4 xl:grid-cols-6">
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-user.svg" data-title="Xin nghỉ phép"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-suitcase.svg" data-title="Đi công tác"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-calendar-clock.svg" data-title="Đăng ký làm ngoài giờ"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-agreement.svg" data-title="Giấy giới thiệu"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-graduation-cap.svg" data-title="Đào tạo – Bồi dưỡng"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-arrow-up.svg" data-title="Nâng bậc lương"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-shield-check.svg" data-title="Chế độ BHXH"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/functions-duties.html#policy-emulation" data-icon="/assets/svgs/icon-award.svg" data-title="Thi đua – Khen thưởng"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/functions-duties.html#organization-personnel" data-icon="/assets/svgs/icon-edit.svg" data-title="Cập nhật hồ sơ nhân sự"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/functions-duties.html#administration-general" data-icon="/assets/svgs/icon-building.svg" data-title="Phòng họp – Cơ sở vật chất"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/functions-duties.html#records-archives" data-icon="/assets/svgs/icon-article.svg" data-title="Văn thư – Lưu trữ"></div>
      <div data-include="@faculty/components/home/staff-services/service-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-grid.svg" data-title="Khác"></div>
    </div>

    <div class="mt-4 sm:hidden">
      <button type="button" data-services-toggle aria-expanded="false" class="group inline-flex h-11 w-full items-center justify-center gap-2 rounded-full border border-primary-dark-blue bg-primary-white px-3 font-roboto text-sm font-semibold text-primary-dark-blue transition-all duration-200 ease-in-out hover:bg-primary-dark-blue hover:text-primary-white hover:shadow-md focus:outline-none focus:ring-2 focus:ring-primary-yellow focus:ring-offset-2">
        <span data-services-toggle-label class="shrink-0">Xem thêm</span>
        <span data-services-toggle-icon class="inline-flex rotate-90 transition-transform duration-200 motion-reduce:transition-none">
          <img src="/assets/svgs/icon-chevron-right.svg" alt="" class="h-4 w-4 shrink-0" />
        </span>
      </button>
    </div>

    <div class="mt-12 flex flex-wrap items-end justify-between gap-x-6 gap-y-2 md:mt-14">
      <div data-include="@shared/components/common/section-title.html"
        data-title="Hệ thống dành cho cán bộ, viên chức"
        data-description="Truy cập nhanh các hệ thống nội bộ của Trường."
        data-class="max-w-2xl"
        data-title-class="leading-tight text-primary-dark-blue"
        data-description-class="mt-1.5 !text-base !leading-6 !text-black">
      </div>
      <div data-include="@shared/components/button/button.html" data-variant="13" data-url="/documents-forms.html" data-text="Xem tất cả hệ thống" data-icon="/assets/svgs/icon-arrow-up-right.svg" data-class="shrink-0 motion-reduce:transition-none" data-icon-class="motion-reduce:transform-none motion-reduce:transition-none"></div>
    </div>

    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <div data-include="@faculty/components/home/staff-services/system-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-article.svg" data-title="E-Office" data-subtitle="Xử lý văn bản, hồ sơ" data-class="bg-gradient-to-br from-[#DCE7FB] to-[#EEF3FE] hover:shadow-[0_14px_30px_rgba(21,56,152,0.15)]" data-icon-class="text-primary-dark-blue"></div>
      <div data-include="@faculty/components/home/staff-services/system-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-user.svg" data-title="HRM" data-subtitle="Thông tin nhân sự" data-class="bg-gradient-to-br from-[#E9E3FB] to-[#F2EEFE] hover:shadow-[0_14px_30px_rgba(124,58,237,0.16)]" data-icon-class="text-[#7C3AED]"></div>
      <div data-include="@faculty/components/home/staff-services/system-item.html" data-url="/documents-forms.html" data-icon="/assets/svgs/icon-online-meeting.svg" data-title="Cổng VC-NLĐ" data-subtitle="Dịch vụ hành chính" data-class="bg-gradient-to-br from-[#DCF3E8] to-[#EDF9F2] hover:shadow-[0_14px_30px_rgba(14,159,110,0.16)]" data-icon-class="text-[#0E9F6E]"></div>
      <div data-include="@faculty/components/home/staff-services/system-item.html" data-url="#weekly-schedule" data-icon="/assets/svgs/icon-calendar-check.svg" data-title="Lịch công tác" data-subtitle="Xem lịch công tác, sự kiện" data-class="bg-gradient-to-br from-[#FDEAD5] to-[#FEF4E7] hover:shadow-[0_14px_30px_rgba(232,137,12,0.18)]" data-icon-class="text-[#E8890C]"></div>
    </div>
  </div>
</section>
