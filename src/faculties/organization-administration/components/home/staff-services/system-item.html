<a href="{{url}}" class="group relative flex items-center gap-4 overflow-hidden rounded-2xl border border-primary-dark-blue/10 bg-primary-white p-5 shadow-[0_10px_28px_-20px_rgba(21,56,152,0.32)] transition-all duration-300 hover:-translate-y-0.5 hover:border-primary-dark-blue/20 hover:shadow-[0_16px_34px_-18px_rgba(21,56,152,0.34)] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow focus-visible:ring-offset-2 motion-reduce:transform-none motion-reduce:transition-none {{class}}">
  <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary-dark-blue">
    <img src="{{icon}}" alt="" class="h-6 w-6 brightness-0 invert" />
  </span>
  <span class="min-w-0 flex-1">
    <span class="block font-inter text-base font-bold leading-snug text-primary-dark-blue md:text-lg">{{title}}</span>
    <span class="mt-0.5 block font-roboto text-sm leading-snug text-black md:text-base">{{subtitle}}</span>
  </span>
  <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#E8EEFC] transition-all duration-300 group-hover:translate-x-0.5 group-hover:bg-primary-yellow motion-reduce:transform-none motion-reduce:transition-none">
    <img src="/assets/svgs/icon-chevron-right.svg" alt="" class="h-4 w-4 brightness-0" />
  </span>
</a>
