<a href="{{url}}" class="group flex items-center gap-4 rounded-2xl p-5 transition-all duration-300 hover:-translate-y-0.5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary-yellow focus-visible:ring-offset-2 motion-reduce:transform-none motion-reduce:transition-none {{class}}">
  <span class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-primary-white shadow-sm {{iconClass}}">
    <img src="{{icon}}" alt="" class="h-6 w-6" />
  </span>
  <span class="min-w-0 flex-1">
    <span class="block font-inter text-base font-bold leading-snug text-primary-dark-blue md:text-lg">{{title}}</span>
    <span class="mt-0.5 block font-roboto text-sm leading-snug text-black md:text-base">{{subtitle}}</span>
  </span>
  <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-primary-white shadow-sm transition-transform duration-300 group-hover:translate-x-0.5 motion-reduce:transform-none {{iconClass}}">
    <img src="/assets/svgs/icon-chevron-right.svg" alt="" class="h-4 w-4" />
  </span>
</a>
