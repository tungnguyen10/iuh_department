<section data-module="jobs-opportunities" id="jobs-opportunities" class="w-full bg-secondary-blue-light py-10 md:py-14 {{class}}">
  <div class="container mx-auto px-4">
    <div class="flex flex-col gap-5 md:flex-row md:items-end md:justify-between md:gap-8">
      <div data-include="@shared/components/common/section-title.html"
        data-subtitle="Kết nối doanh nghiệp"
        data-title="Việc làm &amp; Cơ hội"
        data-description="Tin tuyển dụng, thực tập được tổng hợp từ các doanh nghiệp đối tác dành cho sinh viên."
        data-class="max-w-3xl">
      </div>
      <div class="hidden shrink-0 md:block">
        <div data-include="@shared/components/button/button.html"
          data-variant="8"
          data-text="Xem thêm cơ hội việc làm"
          data-url="/contact.html"
          data-icon="/assets/svgs/icon-arrow-up-right.svg">
        </div>
      </div>
    </div>

    <div class="mt-6 rounded-2xl border border-primary-dark-blue/10 bg-primary-white p-4 shadow-sm sm:p-5">
      <ul class="divide-y divide-stroke">
        <li>
          <a href="/contact.html" class="grid grid-cols-[3rem_1fr] items-center gap-4 py-3 sm:grid-cols-[3.5rem_1fr]">
            <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-primary-dark-blue">
              <img src="/assets/svgs/icon-suitcase.svg" alt="" class="h-6 w-6 brightness-0 invert" />
            </span>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="font-inter text-base font-bold leading-snug text-title">Thực tập Marketing</h4>
                <span class="rounded bg-secondary-blue-light px-2 py-1 font-roboto text-xs font-bold text-primary-dark-blue">Thực tập</span>
              </div>
              <p class="mt-0.5 font-roboto text-sm font-semibold text-primary-dark-blue">Công ty TNHH ABC</p>
              <p class="mt-1 flex items-center gap-1 font-roboto text-xs text-gray-700">
                <img src="/assets/svgs/icon-location.svg" alt="" class="h-3.5 w-3.5" />TP.HCM
              </p>
            </div>
          </a>
        </li>

        <li>
          <a href="/contact.html" class="grid grid-cols-[3rem_1fr] items-center gap-4 py-3 sm:grid-cols-[3.5rem_1fr]">
            <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-primary-yellow">
              <img src="/assets/svgs/icon-building.svg" alt="" class="h-6 w-6 brightness-0 invert" />
            </span>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="font-inter text-base font-bold leading-snug text-title">Nhân viên kỹ thuật</h4>
                <span class="rounded bg-danger-light px-2 py-1 font-roboto text-xs font-bold text-danger">Toàn thời gian</span>
              </div>
              <p class="mt-0.5 font-roboto text-sm font-semibold text-primary-dark-blue">Công ty Cổ phần XYZ</p>
              <p class="mt-1 flex items-center gap-1 font-roboto text-xs text-gray-700">
                <img src="/assets/svgs/icon-location.svg" alt="" class="h-3.5 w-3.5" />TP.HCM
              </p>
            </div>
          </a>
        </li>

        <li>
          <a href="/contact.html" class="grid grid-cols-[3rem_1fr] items-center gap-4 py-3 sm:grid-cols-[3.5rem_1fr]">
            <span class="flex h-12 w-12 items-center justify-center rounded-lg bg-secondary-blue">
              <img src="/assets/svgs/icon-global-user.svg" alt="" class="h-6 w-6 brightness-0 invert" />
            </span>
            <div class="min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="font-inter text-base font-bold leading-snug text-title">Thực tập sinh IT</h4>
                <span class="rounded bg-secondary-blue-light px-2 py-1 font-roboto text-xs font-bold text-primary-dark-blue">Thực tập</span>
              </div>
              <p class="mt-0.5 font-roboto text-sm font-semibold text-primary-dark-blue">Công ty TNHH DEF</p>
              <p class="mt-1 flex items-center gap-1 font-roboto text-xs text-gray-700">
                <img src="/assets/svgs/icon-location.svg" alt="" class="h-3.5 w-3.5" />TP.HCM
              </p>
            </div>
          </a>
        </li>
      </ul>
    </div>

    <div class="mt-6 flex justify-center md:hidden">
      <div data-include="@shared/components/button/button.html"
        data-variant="8"
        data-text="Xem thêm cơ hội việc làm"
        data-url="/contact.html"
        data-icon="/assets/svgs/icon-arrow-up-right.svg"
        data-class="w-full justify-center">
      </div>
    </div>
  </div>
</section>
