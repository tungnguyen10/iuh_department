<!-- Event Card Component -->
<article
  class="group relative bg-[#FAFAFA] border border-stroke rounded-md h-30 sm:h-36 md:h-[136px] p-2 sm:p-2.5 w-full hover:bg-white hover:border-secondary-blue hover:rounded-lg hover:shadow-[2px_2px_15px_0_rgba(21,56,152,0.2)] transition-all duration-300 cursor-pointer {{class}}">
  <!-- Absolute Link Overlay -->
  <a href="{{link}}" class="absolute inset-0 z-30 rounded-md group-hover:rounded-lg" aria-label="{{title}}">
    <span class="sr-only">{{title}}</span>
  </a>

  <div class="flex gap-3 sm:gap-4 md:gap-5 h-full">
    <!-- Thumbnail -->
    <div class="shrink-0 aspect-square rounded-md overflow-hidden">
      <img src="{{image}}" alt="{{imageAlt}}"
        class="w-full h-full object-cover group-hover:scale-110 group-hover:brightness-95 transition-all duration-500" />
    </div>

    <!-- Content -->
    <div class="flex-1 flex flex-col justify-between min-w-0 gap-0.5">
      <h3
        class="font-roboto font-medium text-base sm:text-lg leading-tight text-gray-900 group-hover:text-primary-dark-blue line-clamp-1 transition-colors duration-300">
        {{title}}
      </h3>
      <p class="font-roboto text-sm sm:text-base leading-tight text-gray-600 line-clamp-2">
        {{description}}
      </p>

      <div class="flex items-center justify-between gap-2">
        <div
          class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-white group-hover:bg-secondary-blue-light border border-primary-dark-blue rounded transition-colors duration-300 shrink-0">
          <img src="{{dateIcon}}" alt="" class="w-4 h-4 sm:w-5 sm:h-5 shrink-0 text-primary-dark-blue" />
          <span class="font-roboto font-medium text-xs sm:text-sm text-primary-dark-blue whitespace-nowrap">{{dateBadge}}</span>
        </div>

        <!-- View More Link -->
        <span class="flex items-center gap-0.5 font-roboto font-medium text-xs sm:text-sm text-gray-600 group-hover:text-primary-dark-blue group-hover:gap-1.5 transition-all duration-300">
          Xem thêm
          <img src="/assets/svgs/arrow-right.svg" alt="arrow"
            class="w-3 h-3 sm:w-4 sm:h-4 opacity-0 -translate-x-1 group-hover:opacity-100 group-hover:translate-x-0 transition-all duration-300">
        </span>
      </div>
    </div>
  </div>
</article>
